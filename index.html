<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌙 Cuentos de José Alejandro</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Georgia', serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh;
    padding: 20px;
    color: #fff;
  }
  .header { text-align: center; padding: 30px 20px; margin-bottom: 30px; }
  .header h1 { font-size: 2.2em; color: #ffd700; text-shadow: 0 0 20px rgba(255,215,0,0.5); margin-bottom: 10px; }
  .header p { color: #b0c4de; font-size: 1em; }
  .stars { font-size: 1.5em; margin: 10px 0; letter-spacing: 5px; }
  .search-bar { display: flex; justify-content: center; margin-bottom: 30px; gap: 10px; flex-wrap: wrap; }
  .search-bar input { padding: 10px 20px; border-radius: 25px; border: none; background: rgba(255,255,255,0.1); color: #fff; font-size: 1em; width: 250px; outline: none; }
  .search-bar input::placeholder { color: #b0c4de; }
  .filter-btn { padding: 10px 20px; border-radius: 25px; border: 2px solid #ffd700; background: transparent; color: #ffd700; cursor: pointer; font-size: 0.9em; transition: all 0.3s; }
  .filter-btn:hover, .filter-btn.active { background: #ffd700; color: #1a1a2e; }
  .date-group { margin-bottom: 40px; }
  .date-label { font-size: 1.1em; color: #ffd700; margin-bottom: 15px; padding: 8px 16px; background: rgba(255,215,0,0.1); border-left: 4px solid #ffd700; border-radius: 0 10px 10px 0; }
  .cuentos-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
  .cuento-card { background: rgba(255,255,255,0.07); border-radius: 20px; padding: 25px; border: 1px solid rgba(255,255,255,0.1); transition: transform 0.3s, box-shadow 0.3s; position: relative; overflow: hidden; }
  .cuento-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.3); }
  .cuento-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; }
  .cuento-card.es::before { background: linear-gradient(90deg, #e74c3c, #f39c12); }
  .cuento-card.en::before { background: linear-gradient(90deg, #3498db, #2ecc71); }
  .cuento-card.it::before { background: linear-gradient(90deg, #9b59b6, #e74c3c); }
  .lang-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.75em; font-weight: bold; margin-bottom: 12px; letter-spacing: 1px; }
  .lang-es { background: rgba(231,76,60,0.3); color: #e74c3c; border: 1px solid #e74c3c; }
  .lang-en { background: rgba(52,152,219,0.3); color: #3498db; border: 1px solid #3498db; }
  .lang-it { background: rgba(155,89,182,0.3); color: #9b59b6; border: 1px solid #9b59b6; }
  .cuento-titulo { font-size: 1.2em; color: #ffd700; margin-bottom: 12px; line-height: 1.3; }
  .cuento-texto { font-size: 0.9em; color: #d0d0d0; line-height: 1.7; margin-bottom: 15px; }
  .traduccion { background: rgba(255,255,255,0.05); border-radius: 10px; padding: 12px; margin-bottom: 12px; font-size: 0.85em; color: #b0c4de; }
  .moraleja { font-size: 0.85em; color: #ffd700; font-style: italic; padding-top: 10px; border-top: 1px solid rgba(255,215,0,0.2); }
  .pregunta { font-size: 0.85em; color: #2ecc71; margin-top: 10px; }
  .contador { text-align: center; color: #b0c4de; margin-bottom: 20px; font-size: 0.9em; }
  .no-results { text-align: center; color: #b0c4de; padding: 40px; font-size: 1.1em; }
  @media (max-width: 600px) { .header h1 { font-size: 1.6em; } .cuentos-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="header">
  <div class="stars">⭐ 🌙 ⭐</div>
  <h1>Cuentos de José Alejandro</h1>
  <p>Una nueva historia cada noche • Español · English · Italiano</p>
</div>
<div class="search-bar">
  <input type="text" id="searchInput" placeholder="🔍 Buscar cuento..." oninput="filtrar()">
  <button class="filter-btn active" onclick="setFiltro('todos',event)">Todos</button>
  <button class="filter-btn" onclick="setFiltro('es',event)">🇪🇸 Español</button>
  <button class="filter-btn" onclick="setFiltro('en',event)">🇬🇧 English</button>
  <button class="filter-btn" onclick="setFiltro('it',event)">🇮🇹 Italiano</button>
</div>
<div class="contador" id="contador"></div>
<div id="biblioteca"></div>
<script>
const cuentos = [
  {id:"1",fecha:"30/03/2026",lang:"es",titulo:"El farolito y la luna",texto:"Había una vez un pequeño farolito que vivía en lo alto de una colina. Cada noche encendía su luz para guiar a los viajeros, pero se sentía solo. Una noche, la luna le dijo: 'Nunca estás solo, yo siempre te acompaño desde arriba.' Desde entonces el farolito brilló más feliz que nunca.",traduccion:"",moraleja:"Siempre hay alguien que nos acompaña aunque no lo veamos.",pregunta:"¿Qué harías tú si fueras un farolito mágico?"},
  {id:"2",fecha:"30/03/2026",lang:"en",titulo:"The Library Boat",texto:"A small boat sailed through the town at night, carrying books for everyone who was asleep. It left one book under each pillow — always the perfect story for that person. Nobody knew who sailed it, but every morning children woke up with new adventures waiting.",traduccion:"Un pequeño bote navegaba por el pueblo de noche llevando libros. Dejaba uno bajo cada almohada — siempre la historia perfecta. Nadie sabía quién lo manejaba, pero cada mañana los niños despertaban con nuevas aventuras esperándolos.",moraleja:"Las mejores historias llegan cuando menos las esperas.",pregunta:"What book would you leave under someone's pillow?"},
  {id:"3",fecha:"30/03/2026",lang:"it",titulo:"Il giardino delle stelle",texto:"Nel giardino dietro casa c'era un seme speciale. Di notte cresceva piano piano e al mattino fioriva in una stella d'oro. La bambina lo innaffiava ogni sera con un pensiero gentile, e il giardino diventò il più luminoso del mondo.",traduccion:"En el jardín de casa había una semilla especial. De noche crecía poco a poco y en la mañana florecía en una estrella dorada. La niña la regaba cada noche con un pensamiento amable, y el jardín se volvió el más luminoso del mundo.",moraleja:"Los pensamientos amables hacen crecer cosas hermosas.",pregunta:"¿Qué pensamiento amable tendrías tú hoy?"}
];
let filtroActivo='todos';
function setFiltro(f,e){filtroActivo=f;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');filtrar();}
function filtrar(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  let r=cuentos;
  if(filtroActivo!=='todos')r=r.filter(c=>c.lang===filtroActivo);
  if(q)r=r.filter(c=>c.titulo.toLowerCase().includes(q)||c.texto.toLowerCase().includes(q));
  const byDate={};
  r.forEach(c=>{if(!byDate[c.fecha])byDate[c.fecha]=[];byDate[c.fecha].push(c);});
  const lib=document.getElementById('biblioteca');
  const fechas=Object.keys(byDate).sort().reverse();
  if(fechas.length===0){lib.innerHTML='<div class="no-results">🌙 No se encontraron cuentos...</div>';document.getElementById('contador').textContent='';return;}
  document.getElementById('contador').textContent=`${r.length} cuento${r.length!==1?'s':''} encontrado${r.length!==1?'s':''}`;
  lib.innerHTML=fechas.map(fecha=>`
    <div class="date-group">
      <div class="date-label">🌙 ${fecha}</div>
      <div class="cuentos-grid">
        ${byDate[fecha].map(c=>`
          <div class="cuento-card ${c.lang}">
            <span class="lang-badge lang-${c.lang}">${c.lang==='es'?'🇪🇸 Español':c.lang==='en'?'🇬🇧 English':'🇮🇹 Italiano'}</span>
            <div class="cuento-titulo">${c.titulo}</div>
            <div class="cuento-texto">${c.texto}</div>
            ${c.traduccion?`<div class="traduccion">📖 <strong>Traducción:</strong> ${c.traduccion}</div>`:''}
            ${c.moraleja?`<div class="moraleja">✨ ${c.moraleja}</div>`:''}
            ${c.pregunta?`<div class="pregunta">🎯 ${c.pregunta}</div>`:''}
          </div>`).join('')}
      </div>
    </div>`).join('');
}
filtrar();
</script>
</body>
</html>
