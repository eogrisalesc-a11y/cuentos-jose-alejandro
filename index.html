<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌙 Cuentos de José Alejandro</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Georgia', serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh;
    padding: 20px;
    color: #fff;
  }
  .header { text-align: center; padding: 30px 20px; margin-bottom: 30px; }
  .header h1 { font-size: 2.2em; color: #ffd700; text-shadow: 0 0 20px rgba(255,215,0,0.5); margin-bottom: 10px; }
  .header p { color: #b0c4de; font-size: 1em; }
  .stars { font-size: 1.5em; margin: 10px 0; letter-spacing: 5px; }
  .search-bar { display: flex; justify-content: center; margin-bottom: 30px; gap: 10px; flex-wrap: wrap; }
  .search-bar input { padding: 10px 20px; border-radius: 25px; border: none; background: rgba(255,255,255,0.1); color: #fff; font-size: 1em; width: 250px; outline: none; }
  .search-bar input::placeholder { color: #b0c4de; }
  .filter-btn { padding: 10px 20px; border-radius: 25px; border: 2px solid #ffd700; background: transparent; color: #ffd700; cursor: pointer; font-size: 0.9em; transition: all 0.3s; }
  .filter-btn:hover, .filter-btn.active { background: #ffd700; color: #1a1a2e; }
  .date-group { margin-bottom: 40px; }
  .date-label { font-size: 1.1em; color: #ffd700; margin-bottom: 15px; padding: 8px 16px; background: rgba(255,215,0,0.1); border-left: 4px solid #ffd700; border-radius: 0 10px 10px 0; }
  .cuentos-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
  .cuento-card { background: rgba(255,255,255,0.07); border-radius: 20px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); transition: transform 0.3s, box-shadow 0.3s; }
  .cuento-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.3); }
  .cuento-imagen { width: 100%; height: 200px; object-fit: cover; display: block; }
  .cuento-imagen-placeholder { width: 100%; height: 200px; display: flex; align-items: center; justify-content: center; font-size: 4em; }
  .cuento-img-es { background: linear-gradient(135deg, #e74c3c33, #f39c1233); }
  .cuento-img-en { background: linear-gradient(135deg, #3498db33, #2ecc7133); }
  .cuento-img-it { background: linear-gradient(135deg, #9b59b633, #e74c3c33); }
  .cuento-body { padding: 20px; }
  .lang-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.75em; font-weight: bold; margin-bottom: 12px; letter-spacing: 1px; }
  .lang-es { background: rgba(231,76,60,0.3); color: #e74c3c; border: 1px solid #e74c3c; }
  .lang-en { background: rgba(52,152,219,0.3); color: #3498db; border: 1px solid #3498db; }
  .lang-it { background: rgba(155,89,182,0.3); color: #9b59b6; border: 1px solid #9b59b6; }
  .cuento-titulo { font-size: 1.25em; color: #ffd700; margin-bottom: 15px; line-height: 1.3; }
  .cuento-texto { font-size: 0.92em; color: #d0d0d0; line-height: 1.8; margin-bottom: 15px; }
  .traduccion { background: rgba(255,255,255,0.05); border-radius: 10px; padding: 12px; margin-bottom: 12px; font-size: 0.85em; color: #b0c4de; border-left: 3px solid #3498db; }
  .moraleja { font-size: 0.88em; color: #ffd700; font-style: italic; padding: 12px 0; border-top: 1px solid rgba(255,215,0,0.2); margin-bottom: 10px; }
  .pregunta { font-size: 0.88em; color: #2ecc71; background: rgba(46,204,113,0.1); padding: 10px 12px; border-radius: 10px; border-left: 3px solid #2ecc71; }
  .contador { text-align: center; color: #b0c4de; margin-bottom: 20px; font-size: 0.9em; }
  .no-results { text-align: center; color: #b0c4de; padding: 40px; font-size: 1.1em; }
  @media (max-width: 600px) {
    .header h1 { font-size: 1.6em; }
    .cuentos-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="header">
  <div class="stars">⭐ 🌙 ⭐</div>
  <h1>Cuentos de José Alejandro</h1>
  <p>Una nueva historia cada noche • Español · English · Italiano</p>
</div>
<div class="search-bar">
  <input type="text" id="searchInput" placeholder="🔍 Buscar cuento..." oninput="filtrar()">
  <button class="filter-btn active" onclick="setFiltro('todos',event)">Todos</button>
  <button class="filter-btn" onclick="setFiltro('es',event)">🇪🇸 Español</button>
  <button class="filter-btn" onclick="setFiltro('en',event)">🇬🇧 English</button>
  <button class="filter-btn" onclick="setFiltro('it',event)">🇮🇹 Italiano</button>
</div>
<div class="contador" id="contador"></div>
<div id="biblioteca"></div>
<script>
const cuentos = [
  {"id": "20260330051259_0", "fecha": "30/03/2026", "lang": "es", "titulo": "El dragón que coleccionaba nubes", "texto": "Había un dragón pequeño llamado Nube que vivía en lo alto de una montaña azul. A diferencia de los otros dragones, él no escupía fuego — escupía nubes de colores. Nubes rosas cuando estaba contento, grises cuando pensaba mucho, y doradas justo antes de dormir. Un día, un niño de un pueblo cercano subió la montaña buscando su cometa perdida. La encontró atrapada en una nube morada. El dragón la liberó soplando suavemente, y la nube se transformó en una estrella. Desde esa noche, el niño siempre miraba el cielo antes de dormir, buscando la estrella morada que le guiñaba el ojo. Y el dragón, que por fin tenía un amigo, dormía tranquilo sabiendo que alguien pensaba en él desde el pueblo.", "traduccion": "", "moraleja": "La amistad más especial nace cuando ayudas sin esperar nada a cambio.", "pregunta": "¿De qué color sería tu nube si pudieras soplar nubes mágicas?", "imagen": ""},
  {"id": "20260330051259_1", "fecha": "30/03/2026", "lang": "en", "titulo": "The Lighthouse Keeper and the Sleepy Sea", "texto": "On a tiny island lived an old lighthouse keeper named Theo and his cat, Barnacle. Every night, Theo climbed 99 steps to light the lamp so ships could find their way home. But one stormy night, the lamp went out. Theo was worried — without the light, a ship might get lost. Barnacle, who had never done anything particularly useful before, jumped onto the windowsill and began to glow. Cats from the island had an old secret: when they truly wanted to help, they could shine like small suns. The ship saw the light and arrived safely. From that night on, Barnacle slept curled on top of the lamp, and ships always knew the island was near.", "traduccion": "En una pequeña isla vivía un viejo guardián de faro llamado Theo y su gato Barnacle. Cada noche Theo subía 99 escalones para encender la lámpara. Una noche tormentosa se apagó. Barnacle, que nunca había hecho nada útil, saltó a la ventana y comenzó a brillar. Los gatos de la isla tenían un secreto: cuando querían ayudar de verdad, brillaban como pequeños soles. El barco vio la luz y llegó sano y salvo.", "moraleja": "Everyone has a hidden light — it only shines when someone truly needs it.", "pregunta": "If you could glow like Barnacle, when would you use your light?", "imagen": ""},
  {"id": "20260330051259_2", "fecha": "30/03/2026", "lang": "it", "titulo": "La biblioteca sotto il lago", "texto": "In fondo al lago del villaggio, nascosta tra le radici degli alberi, c\\'era una biblioteca segreta. I pesci erano i bibliotecari e i libri erano fatti di foglie pressate e conchiglie. Una bambina di nome Sofia scoprì la biblioteca un pomeriggio d\\'autunno, quando buttò una foglia nell\\'acqua e sparì. Seguendola, trovò migliaia di storie scritte in linguaggi di bolle e correnti. Il pesce più vecchio, che si chiamava Pagina, le disse che ogni persona ha una storia scritta là dentro — la storia di chi sarà da grande. Sofia aprì il suo libro e trovò solo due parole: \"Ancora in corso.\" Tornò a casa sorridendo, perché capì che la parte più bella della storia doveva ancora essere scritta.", "traduccion": "En el fondo del lago había una biblioteca secreta. Los peces eran los bibliotecarios y los libros estaban hechos de hojas y conchas. Una niña llamada Sofía la descubrió siguiendo una hoja que cayó al agua. El pez más viejo le dijo que cada persona tiene una historia escrita allí — la historia de quién será de grande. Sofía abrió su libro y encontró solo dos palabras: \"Aún en curso.\" Volvió a casa sonriendo porque entendió que la mejor parte aún estaba por escribirse.", "moraleja": "La tua storia è ancora in corso — e la parte più bella deve ancora arrivare.", "pregunta": "¿Qué dos palabras encontrarías en tu libro si pudieras leerlo hoy?", "imagen": ""},
  // CUENTOS_DATA
];
let filtroActivo='todos';
function setFiltro(f,e){
  filtroActivo=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  filtrar();
}
function filtrar(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  let r=cuentos;
  if(filtroActivo!=='todos') r=r.filter(c=>c.lang===filtroActivo);
  if(q) r=r.filter(c=>c.titulo.toLowerCase().includes(q)||c.texto.toLowerCase().includes(q));
  const byDate={};
  r.forEach(c=>{if(!byDate[c.fecha])byDate[c.fecha]=[];byDate[c.fecha].push(c);});
  const lib=document.getElementById('biblioteca');
  const fechas=Object.keys(byDate).sort().reverse();
  if(fechas.length===0){
    lib.innerHTML='<div class="no-results">🌙 No se encontraron cuentos...</div>';
    document.getElementById('contador').textContent='';
    return;
  }
  document.getElementById('contador').textContent=`${r.length} cuento${r.length!==1?'s':''} encontrado${r.length!==1?'s':''}`;
  lib.innerHTML=fechas.map(fecha=>`
    <div class="date-group">
      <div class="date-label">🌙 ${fecha}</div>
      <div class="cuentos-grid">
        ${byDate[fecha].map(c=>`
          <div class="cuento-card">
            ${c.imagen
              ? `<img class="cuento-imagen" src="${c.imagen}" alt="${c.titulo}" onerror="this.parentNode.removeChild(this)">`
              : `<div class="cuento-imagen-placeholder cuento-img-${c.lang}">${c.lang==='es'?'🌙':c.lang==='en'?'⭐':'✨'}</div>`
            }
            <div class="cuento-body">
              <span class="lang-badge lang-${c.lang}">${c.lang==='es'?'🇪🇸 Español':c.lang==='en'?'🇬🇧 English':'🇮🇹 Italiano'}</span>
              <div class="cuento-titulo">${c.titulo}</div>
              <div class="cuento-texto">${c.texto}</div>
              ${c.traduccion?`<div class="traduccion">📖 <strong>Traducción:</strong><br>${c.traduccion}</div>`:''}
              ${c.moraleja?`<div class="moraleja">✨ ${c.moraleja}</div>`:''}
              ${c.pregunta?`<div class="pregunta">🎯 ${c.pregunta}</div>`:''}
            </div>
          </div>`).join('')}
      </div>
    </div>`).join('');
}
filtrar();
</script>
</body>
</html>
