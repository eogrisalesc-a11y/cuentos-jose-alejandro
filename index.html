<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌙 Cuentos de José Alejandro</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Georgia', serif;
    background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    min-height: 100vh;
    padding: 20px;
    color: #fff;
  }
  .header { text-align: center; padding: 40px 20px 30px; margin-bottom: 30px; }
  .header h1 {
    font-size: 2.5em;
    background: linear-gradient(135deg, #ffd700, #ff9500);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
    text-shadow: none;
  }
  .header p { color: #b0c4de; font-size: 1em; }
  .stars { font-size: 2em; margin: 10px 0; letter-spacing: 8px; }
  .search-bar { display: flex; justify-content: center; margin-bottom: 30px; gap: 10px; flex-wrap: wrap; }
  .search-bar input {
    padding: 12px 24px; border-radius: 30px; border: 1px solid rgba(255,215,0,0.3);
    background: rgba(255,255,255,0.08); color: #fff; font-size: 1em; width: 260px;
    outline: none; backdrop-filter: blur(10px); transition: border 0.3s;
  }
  .search-bar input:focus { border-color: #ffd700; }
  .search-bar input::placeholder { color: #7a8fa6; }
  .filter-btn {
    padding: 10px 22px; border-radius: 30px; border: 1.5px solid rgba(255,215,0,0.5);
    background: rgba(255,215,0,0.05); color: #ffd700; cursor: pointer;
    font-size: 0.9em; transition: all 0.3s; backdrop-filter: blur(10px);
  }
  .filter-btn:hover, .filter-btn.active {
    background: linear-gradient(135deg, #ffd700, #ff9500);
    color: #1a1a2e; border-color: transparent; transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(255,215,0,0.3);
  }
  .date-group { margin-bottom: 50px; }
  .date-label {
    font-size: 1em; color: #ffd700; margin-bottom: 20px; padding: 10px 20px;
    background: linear-gradient(90deg, rgba(255,215,0,0.15), transparent);
    border-left: 4px solid #ffd700; border-radius: 0 12px 12px 0;
    letter-spacing: 1px;
  }
  .cuentos-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px; }
  .cuento-card {
    background: rgba(255,255,255,0.05);
    border-radius: 24px; overflow: hidden;
    border: 1px solid rgba(255,255,255,0.1);
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s;
    backdrop-filter: blur(10px);
  }
  .cuento-card:hover {
    transform: translateY(-8px) scale(1.01);
    box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,215,0,0.2);
  }
  .cuento-imagen-wrap { position: relative; width: 100%; height: 220px; overflow: hidden; }
  .cuento-imagen-wrap svg, .cuento-imagen-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .lang-overlay {
    position: absolute; top: 12px; left: 12px;
    padding: 5px 14px; border-radius: 20px; font-size: 0.75em; font-weight: bold;
    letter-spacing: 0.5px; backdrop-filter: blur(10px);
  }
  .overlay-es { background: rgba(231,76,60,0.85); color: white; }
  .overlay-en { background: rgba(52,152,219,0.85); color: white; }
  .overlay-it { background: rgba(155,89,182,0.85); color: white; }
  .cuento-body { padding: 22px; }
  .cuento-titulo { font-size: 1.2em; color: #ffd700; margin-bottom: 14px; line-height: 1.4; }
  .cuento-texto { font-size: 0.91em; color: #c8d8e8; line-height: 1.85; margin-bottom: 16px; }
  .traduccion {
    background: rgba(52,152,219,0.1); border-radius: 12px; padding: 14px;
    margin-bottom: 14px; font-size: 0.85em; color: #90b8d4;
    border-left: 3px solid rgba(52,152,219,0.6);
  }
  .moraleja {
    font-size: 0.88em; color: #ffd700; font-style: italic;
    padding: 12px 0; border-top: 1px solid rgba(255,215,0,0.2); margin-bottom: 12px;
  }
  .pregunta {
    font-size: 0.88em; color: #2ecc71;
    background: rgba(46,204,113,0.08); padding: 12px 14px;
    border-radius: 12px; border-left: 3px solid rgba(46,204,113,0.5);
  }
  .contador { text-align: center; color: #7a8fa6; margin-bottom: 25px; font-size: 0.9em; }
  .no-results { text-align: center; color: #7a8fa6; padding: 60px; font-size: 1.1em; }
  .empty-state { text-align: center; padding: 80px 20px; }
  .empty-state .emoji { font-size: 4em; margin-bottom: 20px; }
  .empty-state p { color: #7a8fa6; font-size: 1.1em; }
  @media (max-width: 600px) {
    .header h1 { font-size: 1.8em; }
    .cuentos-grid { grid-template-columns: 1fr; }
    .search-bar input { width: 100%; }
  }
</style>
</head>

let filtroActivo='todos';
function setFiltro(f,e){
  filtroActivo=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  filtrar();
}
function filtrar(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  let r=cuentos;
  if(filtroActivo!=='todos') r=r.filter(c=>c.lang===filtroActivo);
  if(q) r=r.filter(c=>c.titulo.toLowerCase().includes(q)||c.texto.toLowerCase().includes(q)||c.fecha.includes(q));
  const byDate={};
  r.forEach(c=>{if(!byDate[c.fecha])byDate[c.fecha]=[];byDate[c.fecha].push(c);});
  const lib=document.getElementById('biblioteca');
  const fechas=Object.keys(byDate).sort().reverse();
  if(cuentos.length===0){
    lib.innerHTML=`<div class="empty-state"><div class="emoji">🌙</div><p>Los primeros cuentos llegarán esta noche...</p></div>`;
    document.getElementById('contador').textContent='';
    return;
  }
  if(fechas.length===0){
    lib.innerHTML='<div class="no-results">🌙 No se encontraron cuentos...</div>';
    document.getElementById('contador').textContent='';
    return;
  }
  document.getElementById('contador').textContent=`${r.length} cuento${r.length!==1?'s':''} en la biblioteca`;
  lib.innerHTML=fechas.map(fecha=>`
    <div class="date-group">
      <div class="date-label">🌙 ${fecha}</div>
      <div class="cuentos-grid">
        ${byDate[fecha].map(c=>`
          <div class="cuento-card">
            <div class="cuento-imagen-wrap">
              ${SVGS[c.lang]||SVGS.es}
              <div class="lang-overlay overlay-${c.lang}">${c.lang==='es'?'🇪🇸 Español':c.lang==='en'?'🇬🇧 English':'🇮🇹 Italiano'}</div>
            </div>
            <div class="cuento-body">
              <div class="cuento-titulo">${c.titulo}</div>
              <div class="cuento-texto">${c.texto}</div>
              ${c.traduccion?`<div class="traduccion">📖 <strong>Traducción:</strong><br>${c.traduccion}</div>`:''}
              ${c.moraleja?`<div class="moraleja">✨ ${c.moraleja}</div>`:''}
              ${c.pregunta?`<div class="pregunta">🎯 ${c.pregunta}</div>`:''}
            </div>
          </div>`).join('')}
      </div>
    </div>`).join('');
}
filtrar();
</script>
</body>
</html>
