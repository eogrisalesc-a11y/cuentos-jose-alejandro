<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌙 Cuentos de José Alejandro</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Georgia, serif; background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%); min-height: 100vh; padding: 20px; color: #fff; }
  .header { text-align: center; padding: 40px 20px 30px; margin-bottom: 30px; }
  .header h1 { font-size: 2.4em; background: linear-gradient(135deg, #ffd700, #ff9500); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 10px; }
  .header p { color: #b0c4de; font-size: 1em; }
  .stars { font-size: 2em; margin: 10px 0; letter-spacing: 8px; }
  .search-bar { display: flex; justify-content: center; margin-bottom: 20px; }
  .search-bar input { padding: 10px 20px; border-radius: 30px; border: 1px solid rgba(255,215,0,0.3); background: rgba(255,255,255,0.08); color: #fff; font-size: 1em; width: 280px; outline: none; }
  .search-bar input::placeholder { color: #7a8fa6; }
  .filters { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .filter-btn { padding: 8px 18px; border-radius: 30px; border: 1.5px solid rgba(255,215,0,0.5); background: rgba(255,215,0,0.05); color: #ffd700; cursor: pointer; font-size: 0.85em; transition: all 0.3s; }
  .filter-btn:hover, .filter-btn.active { background: linear-gradient(135deg, #ffd700, #ff9500); color: #1a1a2e; border-color: transparent; transform: translateY(-2px); }
  .filter-section { text-align: center; margin-bottom: 10px; }
  .filter-label { font-size: 0.75em; color: #7a8fa6; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
  .date-group { margin-bottom: 40px; }
  .date-label { font-size: 1em; color: #ffd700; margin-bottom: 18px; padding: 10px 18px; background: linear-gradient(90deg, rgba(255,215,0,0.15), transparent); border-left: 4px solid #ffd700; border-radius: 0 12px 12px 0; }
  .cuentos-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 22px; }
  .cuento-card { background: rgba(255,255,255,0.05); border-radius: 22px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); transition: transform 0.4s, box-shadow 0.4s; }
  .cuento-card:hover { transform: translateY(-6px); box-shadow: 0 18px 36px rgba(0,0,0,0.35); }
  .cuento-img { width: 100%; height: 200px; object-fit: cover; display: block; }
  .cuento-img-placeholder { width: 100%; height: 200px; display: flex; align-items: center; justify-content: center; font-size: 3.5em; }
  .img-wrap { position: relative; }
  .lang-overlay { position: absolute; top: 10px; left: 10px; padding: 4px 12px; border-radius: 20px; font-size: 0.72em; font-weight: bold; backdrop-filter: blur(8px); }
  .overlay-es { background: rgba(231,76,60,0.85); }
  .overlay-en { background: rgba(52,152,219,0.85); }
  .overlay-it { background: rgba(155,89,182,0.85); }
  .cuento-body { padding: 20px; }
  .cuento-titulo { font-size: 1.15em; color: #ffd700; margin-bottom: 12px; line-height: 1.4; }
  .cuento-texto { font-size: 0.9em; color: #c8d8e8; line-height: 1.8; margin-bottom: 14px; }
  .traduccion { background: rgba(52,152,219,0.1); border-radius: 10px; padding: 12px; margin-bottom: 12px; font-size: 0.84em; color: #90b8d4; border-left: 3px solid rgba(52,152,219,0.5); }
  .moraleja { font-size: 0.87em; color: #ffd700; font-style: italic; padding: 10px 0; border-top: 1px solid rgba(255,215,0,0.2); margin-bottom: 10px; }
  .pregunta { font-size: 0.87em; color: #2ecc71; background: rgba(46,204,113,0.08); padding: 10px 12px; border-radius: 10px; border-left: 3px solid rgba(46,204,113,0.4); margin-bottom: 10px; }
  .palabra-nueva { font-size: 0.84em; background: rgba(255,215,0,0.08); padding: 10px 12px; border-radius: 10px; border-left: 3px solid rgba(255,215,0,0.4); color: #ffe066; margin-bottom: 10px; }
  .audio-btn { margin-top: 8px; width: 100%; padding: 10px; border-radius: 10px; background: rgba(155,89,182,0.2); border: 1px solid rgba(155,89,182,0.4); color: #c39bd3; cursor: pointer; font-size: 0.85em; transition: all 0.3s; }
  .audio-btn:hover { background: rgba(155,89,182,0.4); }
  .audio-btn.playing { background: rgba(155,89,182,0.6); }
  .contador { text-align: center; color: #7a8fa6; margin-bottom: 20px; font-size: 0.88em; }
  .no-results { text-align: center; color: #7a8fa6; padding: 60px; font-size: 1.1em; }
  .empty-state { text-align: center; padding: 80px 20px; }
  .loading { text-align: center; padding: 60px; color: #7a8fa6; font-size: 1.1em; }
  @media (max-width: 600px) { .header h1 { font-size: 1.8em; } .cuentos-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="header">
  <div class="stars">⭐ 🌙 ⭐</div>
  <h1>Cuentos de José Alejandro</h1>
  <p>Una nueva historia cada noche • Español · English · Italiano</p>
</div>
<div class="search-bar">
  <input type="text" id="searchInput" placeholder="🔍 Buscar cuento..." oninput="filtrar()">
</div>
<div class="filter-section">
  <div class="filter-label">Idioma</div>
  <div class="filters" id="filtros-idioma">
    <button class="filter-btn active" onclick="setFiltro('lang','todos',this)">Todos</button>
    <button class="filter-btn" onclick="setFiltro('lang','es',this)">🇪🇸 Español</button>
    <button class="filter-btn" onclick="setFiltro('lang','en',this)">🇬🇧 English</button>
    <button class="filter-btn" onclick="setFiltro('lang','it',this)">🇮🇹 Italiano</button>
  </div>
</div>
<div class="filter-section" style="margin-top:8px;">
  <div class="filter-label">Fecha</div>
  <div class="filters" id="filtros-fecha"></div>
</div>
<div class="contador" id="contador"></div>
<div id="biblioteca"><div class="loading">🌙 Cargando cuentos...</div></div>

<script>
let cuentos = [];
let filtros = { lang: "todos", fecha: "todas" };
let audioActual = null;

fetch("cuentos.json?" + Date.now())
  .then(r => r.json())
  .then(data => {
    cuentos = data;
    iniciarFiltrosFecha();
    filtrar();
  })
  .catch(e => {
    document.getElementById("biblioteca").innerHTML = "<div class=empty-state><div style=font-size:4em>🌙</div><p style=margin-top:20px>Los primeros cuentos llegarán esta noche...</p></div>";
  });

function iniciarFiltrosFecha() {
  const fechasUnicas = [...new Set(cuentos.map(c => c.fecha))].sort((a,b) => {
    const pa = a.split("/"), pb = b.split("/");
    return new Date(pb[2],pb[1]-1,pb[0]) - new Date(pa[2],pa[1]-1,pa[0]);
  });
  const fdiv = document.getElementById("filtros-fecha");
  fdiv.innerHTML = "";
  const btnTodas = document.createElement("button");
  btnTodas.className = "filter-btn active";
  btnTodas.textContent = "Todas";
  btnTodas.onclick = function(){ setFiltro("fecha","todas",this); };
  fdiv.appendChild(btnTodas);
  fechasUnicas.forEach(f => {
    const b = document.createElement("button");
    b.className = "filter-btn";
    const p = f.split("/");
    b.textContent = p[0]+"/"+p[1];
    b.onclick = function(){ setFiltro("fecha",f,this); };
    fdiv.appendChild(b);
  });
}

function setFiltro(tipo, val, el) {
  filtros[tipo] = val;
  const grupo = tipo === "lang" ? "filtros-idioma" : "filtros-fecha";
  document.getElementById(grupo).querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  el.classList.add("active");
  filtrar();
}

function getPalette(c) {
  const seed = (c.id.charCodeAt(0) + c.titulo.charCodeAt(0)) % 6;
  const palettes = [
    {bg:"#0a0a1e",accent:"#9b59b6"},{bg:"#0d1b2a",accent:"#3498db"},
    {bg:"#1a0800",accent:"#e74c3c"},{bg:"#001a0d",accent:"#27ae60"},
    {bg:"#1a001a",accent:"#e91e63"},{bg:"#001a1a",accent:"#00bcd4"}
  ];
  return palettes[seed];
}

function getImgUrl(c) {
  if (c.img_url) return c.img_url;
  const seed = c.id.replace(/[^a-z0-9]/gi,"").slice(-8) || "cuento";
  return "https://picsum.photos/seed/" + seed + "/800/400";
}

function playAudio(btn, url) {
  if (audioActual) { audioActual.pause(); audioActual = null; }
  const audio = new Audio(url);
  audioActual = audio;
  btn.textContent = "⏸ Pausar";
  btn.classList.add("playing");
  audio.play();
  audio.onended = function() { btn.textContent = "🔊 Escuchar el cuento"; btn.classList.remove("playing"); audioActual = null; };
  audio.onerror = function() { btn.textContent = "❌ Audio no disponible"; };
}

function crearTarjeta(c) {
  const p = getPalette(c);
  const emoji = c.lang === "es" ? "🌙" : c.lang === "en" ? "⭐" : "✨";
  const imgUrl = getImgUrl(c);
  const langLabel = c.lang === "es" ? "🇪🇸 Español" : c.lang === "en" ? "🇬🇧 English" : "🇮🇹 Italiano";

  const card = document.createElement("div");
  card.className = "cuento-card";

  const imgWrap = document.createElement("div");
  imgWrap.className = "img-wrap";

  const img = document.createElement("img");
  img.className = "cuento-img";
  img.src = imgUrl;
  img.alt = "";
  img.loading = "lazy";
  const ph = document.createElement("div");
  ph.className = "cuento-img-placeholder";
  ph.style.cssText = "background:linear-gradient(135deg," + p.accent + "33," + p.bg + ")";
  ph.textContent = emoji;
  img.onerror = function() { this.style.display="none"; ph.style.display="flex"; };
  imgWrap.appendChild(img);
  imgWrap.appendChild(ph);

  const overlay = document.createElement("div");
  overlay.className = "lang-overlay overlay-" + c.lang;
  overlay.textContent = langLabel;
  imgWrap.appendChild(overlay);
  card.appendChild(imgWrap);

  const body = document.createElement("div");
  body.className = "cuento-body";

  const titulo = document.createElement("div");
  titulo.className = "cuento-titulo";
  titulo.textContent = c.titulo;
  body.appendChild(titulo);

  const texto = document.createElement("div");
  texto.className = "cuento-texto";
  texto.textContent = c.texto;
  body.appendChild(texto);

  if (c.traduccion) {
    const tr = document.createElement("div");
    tr.className = "traduccion";
    tr.textContent = "📖 " + c.traduccion;
    body.appendChild(tr);
  }
  if (c.moraleja) {
    const m = document.createElement("div");
    m.className = "moraleja";
    m.textContent = "✨ " + c.moraleja;
    body.appendChild(m);
  }
  if (c.pregunta) {
    const q = document.createElement("div");
    q.className = "pregunta";
    q.textContent = "🎯 " + c.pregunta;
    body.appendChild(q);
  }
  if (c.palabra) {
    const pal = document.createElement("div");
    pal.className = "palabra-nueva";
    pal.textContent = "📚 " + c.palabra;
    body.appendChild(pal);
  }
  if (c.audio) {
    const btn = document.createElement("button");
    btn.className = "audio-btn";
    btn.textContent = "🔊 Escuchar el cuento";
    btn.onclick = function() { playAudio(this, c.audio); };
    body.appendChild(btn);
  }

  card.appendChild(body);
  return card;
}

function filtrar() {
  const q = document.getElementById("searchInput").value.toLowerCase();
  let r = cuentos;
  if (filtros.lang !== "todos") r = r.filter(c => c.lang === filtros.lang);
  if (filtros.fecha !== "todas") r = r.filter(c => c.fecha === filtros.fecha);
  if (q) r = r.filter(c => c.titulo.toLowerCase().includes(q) || c.texto.toLowerCase().includes(q));

  const byDate = {};
  r.forEach(c => { if (!byDate[c.fecha]) byDate[c.fecha] = []; byDate[c.fecha].push(c); });

  const lib = document.getElementById("biblioteca");
  const fechas = Object.keys(byDate).sort((a,b) => {
    const pa = a.split("/"), pb = b.split("/");
    return new Date(pb[2],pb[1]-1,pb[0]) - new Date(pa[2],pa[1]-1,pa[0]);
  });

  document.getElementById("contador").textContent = r.length + " cuento" + (r.length !== 1 ? "s" : "") + " en la biblioteca";

  if (fechas.length === 0) {
    lib.innerHTML = cuentos.length === 0
      ? "<div class=empty-state><div style=font-size:4em>🌙</div><p style=margin-top:20px>Los primeros cuentos llegarán esta noche...</p></div>"
      : "<div class=no-results>🌙 No se encontraron cuentos...</div>";
    return;
  }

  lib.innerHTML = "";
  fechas.forEach(fecha => {
    const group = document.createElement("div");
    group.className = "date-group";
    const label = document.createElement("div");
    label.className = "date-label";
    label.textContent = "🌙 " + fecha;
    group.appendChild(label);
    const grid = document.createElement("div");
    grid.className = "cuentos-grid";
    byDate[fecha].forEach(c => grid.appendChild(crearTarjeta(c)));
    group.appendChild(grid);
    lib.appendChild(group);
  });
}
</script>
</body>
</html>
