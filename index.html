<style>

  {"id": "20260331004600_0", "fecha": "31/03/2026", "lang": "es", "titulo": "Luna, Timo y el dragón de las campanas suaves", "texto": "Luna y Timo subieron la colina con Lin, el pequeño dragón azul, para averiguar por qué el viento sonaba como campanitas. En la hierba hallaron caracoles dormidos con gotitas en la concha. Cada gota vibraba al pasar la brisa y tocaba una nota distinta. Lin quiso estornudar fuego de emoción, pero solo soltó un humito tibio que secó una hoja mojada. Luna rió en voz baja. Timo escuchó y descubrió algo: las gotas grandes sonaban grave y las pequeñas, agudo. Entonces ordenaron los caracoles alrededor de una piedra y, por un minuto, la colina fue una orquesta diminuta. Cuando la luna salió, los tres guardaron el secreto: algunas músicas no se atrapan; solo se visitan antes de dormir.", "traduccion": "", "moraleja": "Buenas noches: lo más bonito también sabe hablar bajito.", "pregunta": "Si tuvieras una campana de viento mágica, ¿qué sonido le pondrías?"},
  {"id": "20260331004600_1", "fecha": "31/03/2026", "lang": "en", "titulo": "The Moon Map in the Teacup", "texto": "That night, Luna, Timo, and Lin the blue dragon visited Mr. Elio, the island's sleepy cartographer. He looked worried: his moon map had disappeared. They searched quietly until Lin noticed silver light trembling inside a teacup. The map had not vanished at all—it had folded itself into the reflection of the moon. Mr. Elio smiled and explained that old sailors once read directions in water when paper was too precious to waste. Timo held the cup very still. Luna traced the tiny glowing coastlines with her eyes. Lin, trying to help, dipped one claw in and sneezed a puff of warm mist, which made one new island appear. Mr. Elio laughed. “Then tomorrow,” he said, “we shall have somewhere new to wonder about.”", "traduccion": "Esa noche, Luna, Timo y Lin visitaron al señor Elio, un cartógrafo soñoliento. Su mapa de la luna parecía perdido, pero estaba doblado dentro del reflejo de una taza de té. Elio explicó que antiguos marineros leían direcciones en el agua. Lin soltó una nubecita tibia y apareció una isla nueva en el mapa.", "moraleja": "Good night: sometimes the lost thing is only waiting in a quieter place.", "pregunta": "If you found a new island on a moon map, what would you name it?"},
  {"id": "20260331004600_2", "fecha": "31/03/2026", "lang": "it", "titulo": "Il ponte delle lucciole pazienti", "texto": "La sera dopo, Luna, Timo e Lin seguirono una fila di lucciole fino al ruscello dietro il mulino. Il vecchio ponte di legno sembrava sparito. “Forse dorme”, disse Timo. Le lucciole, una per una, si posarono nell'aria come piccoli chiodi di luce, disegnando il contorno del ponte invisibile. Lin avanzò piano, per non spaventare il buio, e scoprì che l'umidità aveva coperto le assi con un muschio lucente. Nei villaggi di montagna, spiegò Luna, a volte si segnano i sentieri con lanternine quando arriva la nebbia. Così fecero anche loro: non per svegliare il ponte, ma per accompagnarlo nel sonno. Quando tornarono a casa, le lucciole continuavano a brillare, pazienti come stelle basse.", "traduccion": "A la noche siguiente, Luna, Timo y Lin siguieron luciérnagas hasta el arroyo. El puente parecía desaparecido, pero las luciérnagas dibujaron su forma en el aire. Descubrieron que el musgo húmedo cubría las tablas. Luna contó que en pueblos de montaña se marcan senderos con luces cuando hay niebla, y ellos hicieron lo mismo, acompañando al puente en su sueño.", "moraleja": "Buona notte: la pazienza accende luci che la fretta non vede.", "pregunta": "¿Preferirías seguir luciérnagas, estrellas o huellas brillantes?"},

  {"id": "20260401000101_0", "fecha": "01/04/2026", "lang": "es", "titulo": "La brújula de las luciérnagas", "texto": "Esa noche, Luna, Timo y Lin el dragón azul descubrieron que el jardín se había llenado de luciérnagas que volaban en círculos, como si buscaran algo importante. Lin, que ya no intentaba parecer feroz a esas horas porque bostezar con colmillos daba muy poca autoridad, observó el cielo y dijo que quizá las pequeñas luces habían perdido el norte. Luna sacó una hoja redonda, la puso sobre el estanque y vio cómo giraba despacio hasta quedarse quieta apuntando hacia el árbol del panal viejo. Timo sonrió: no era magia complicada, era una brújula hecha con paciencia y agua tranquila. Siguieron a las luciérnagas hasta una rama alta donde una de ellas había dejado su primera luz de la noche. Lin alzó a sus amigos con mucho cuidado, recuperaron el brillo perdido y lo devolvieron al grupo. Entonces todas las luciérnagas ordenaron su vuelo y dibujaron una flecha dorada hacia el bosque. Antes de dormir, Luna dijo que orientarse no siempre era correr más rápido; a veces era quedarse quieto el tiempo suficiente para entender hacia dónde ir.", "traduccion": "", "moraleja": "Cuando te detienes con calma, hasta las cosas pequeñas pueden mostrarte el camino.", "pregunta": "Si tuvieras una brújula suave para el corazón, ¿qué crees que te ayudaría a encontrar?"},
  {"id": "20260401000101_1", "fecha": "01/04/2026", "lang": "en", "titulo": "The Library of Quiet Feathers", "texto": "One sleepy evening, Luna, Timo, and Lin the blue dragon heard a soft sneeze from the oak tree near the hill. It was not a dangerous sneeze, only the sort that sounds like a teacup thinking too hard. Inside the tree they found the sparrows’ night library, where each feather on the shelves held a tiny memory of how to build a nest. But the labels had drifted loose in the evening breeze, and the young birds were putting rainy-day feathers next to sun-warm ones. Lin offered a blast of dragon fire, then remembered that libraries generally prefer not to be toasted. So he used a careful puff of cool blue air instead, just enough to keep the feathers from floating away. Luna sorted them by color and curve, while Timo noticed a pattern: the strongest nest always mixed soft feathers with sturdy ones. When the work was done, the sparrows thanked them with seed biscuits so dry that even Lin politely needed water. On the walk home, the moonlight rested on their shoulders, and Luna said that making a good home was a little like making a good day: part softness, part strength, and a place for everyone to rest.", "traduccion": "Una noche tranquila, Luna, Timo y Lin encontraron la biblioteca nocturna de los gorriones, donde cada pluma guardaba un recuerdo para construir nidos. Las ordenaron con calma y aprendieron que un buen hogar mezcla suavidad y firmeza.", "moraleja": "A peaceful home is built with gentleness, care, and a little wisdom.", "pregunta": "What would you place in your perfect nest so everyone feels safe and cozy?"},

let filtroActivo='todos';
function setFiltro(f,e){
  filtroActivo=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  filtrar();
}
function filtrar(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  let r=cuentos;
  if(filtroActivo!=='todos') r=r.filter(c=>c.lang===filtroActivo);
  if(q) r=r.filter(c=>c.titulo.toLowerCase().includes(q)||c.texto.toLowerCase().includes(q)||c.fecha.includes(q));
  const byDate={};
  r.forEach(c=>{if(!byDate[c.fecha])byDate[c.fecha]=[];byDate[c.fecha].push(c);});
  const lib=document.getElementById('biblioteca');
  const fechas=Object.keys(byDate).sort().reverse();
  if(cuentos.length===0){
    lib.innerHTML=`<div class="empty-state"><div class="emoji">🌙</div><p>Los primeros cuentos llegarán esta noche...</p></div>`;
    document.getElementById('contador').textContent='';
    return;
  }
  if(fechas.length===0){
    lib.innerHTML='<div class="no-results">🌙 No se encontraron cuentos...</div>';
    document.getElementById('contador').textContent='';
    return;
  }
  document.getElementById('contador').textContent=`${r.length} cuento${r.length!==1?'s':''} en la biblioteca`;
  lib.innerHTML=fechas.map(fecha=>`
    <div class="date-group">
      <div class="date-label">🌙 ${fecha}</div>
      <div class="cuentos-grid">
        ${byDate[fecha].map(c=>`
          <div class="cuento-card">
            <div class="cuento-imagen-wrap">
              ${SVGS[c.lang]||SVGS.es}
              <div class="lang-overlay overlay-${c.lang}">${c.lang==='es'?'🇪🇸 Español':c.lang==='en'?'🇬🇧 English':'🇮🇹 Italiano'}</div>
            </div>
            <div class="cuento-body">
              <div class="cuento-titulo">${c.titulo}</div>
              <div class="cuento-texto">${c.texto}</div>
              ${c.traduccion?`<div class="traduccion">📖 <strong>Traducción:</strong><br>${c.traduccion}</div>`:''}
              ${c.moraleja?`<div class="moraleja">✨ ${c.moraleja}</div>`:''}
              ${c.pregunta?`<div class="pregunta">🎯 ${c.pregunta}</div>`:''}
            </div>
          </div>`).join('')}
      </div>
    </div>`).join('');
}
filtrar();
