<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>🌙 Cuentos de José Alejandro</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Georgia', serif;
    background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    min-height: 100vh; padding: 20px; color: #fff;
  }
  .header { text-align: center; padding: 40px 20px 30px; margin-bottom: 30px; }
  .header h1 {
    font-size: 2.4em;
    background: linear-gradient(135deg, #ffd700, #ff9500);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    margin-bottom: 10px;
  }
  .header p { color: #b0c4de; font-size: 1em; }
  .stars { font-size: 2em; margin: 10px 0; letter-spacing: 8px; }
  .search-bar { display: flex; justify-content: center; margin-bottom: 20px; gap: 8px; flex-wrap: wrap; }
  .search-bar input {
    padding: 10px 20px; border-radius: 30px; border: 1px solid rgba(255,215,0,0.3);
    background: rgba(255,255,255,0.08); color: #fff; font-size: 1em; width: 240px; outline: none;
  }
  .search-bar input::placeholder { color: #7a8fa6; }
  .filters { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 25px; }
  .filter-btn {
    padding: 8px 18px; border-radius: 30px; border: 1.5px solid rgba(255,215,0,0.5);
    background: rgba(255,215,0,0.05); color: #ffd700; cursor: pointer; font-size: 0.85em; transition: all 0.3s;
  }
  .filter-btn:hover, .filter-btn.active {
    background: linear-gradient(135deg, #ffd700, #ff9500); color: #1a1a2e;
    border-color: transparent; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(255,215,0,0.3);
  }
  .filter-section { text-align: center; margin-bottom: 10px; }
  .filter-label { font-size: 0.75em; color: #7a8fa6; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
  .date-group { margin-bottom: 40px; }
  .date-label {
    font-size: 1em; color: #ffd700; margin-bottom: 18px; padding: 10px 18px;
    background: linear-gradient(90deg, rgba(255,215,0,0.15), transparent);
    border-left: 4px solid #ffd700; border-radius: 0 12px 12px 0;
  }
  .cuentos-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 22px; }
  .cuento-card {
    background: rgba(255,255,255,0.05); border-radius: 22px; overflow: hidden;
    border: 1px solid rgba(255,255,255,0.1); transition: transform 0.4s, box-shadow 0.4s;
  }
  .cuento-card:hover { transform: translateY(-6px); box-shadow: 0 18px 36px rgba(0,0,0,0.35); }
  .cuento-img { width: 100%; height: 200px; object-fit: cover; display: block; }
  .cuento-img-placeholder {
    width: 100%; height: 200px; display: flex; align-items: center; justify-content: center; font-size: 3.5em;
  }
  .lang-overlay {
    position: absolute; top: 10px; left: 10px; padding: 4px 12px; border-radius: 20px;
    font-size: 0.72em; font-weight: bold; backdrop-filter: blur(8px);
  }
  .img-wrap { position: relative; }
  .overlay-es { background: rgba(231,76,60,0.85); }
  .overlay-en { background: rgba(52,152,219,0.85); }
  .overlay-it { background: rgba(155,89,182,0.85); }
  .cuento-body { padding: 20px; }
  .cuento-titulo { font-size: 1.15em; color: #ffd700; margin-bottom: 12px; line-height: 1.4; }
  .cuento-texto { font-size: 0.9em; color: #c8d8e8; line-height: 1.8; margin-bottom: 14px; }
  .traduccion {
    background: rgba(52,152,219,0.1); border-radius: 10px; padding: 12px; margin-bottom: 12px;
    font-size: 0.84em; color: #90b8d4; border-left: 3px solid rgba(52,152,219,0.5);
  }
  .moraleja {
    font-size: 0.87em; color: #ffd700; font-style: italic;
    padding: 10px 0; border-top: 1px solid rgba(255,215,0,0.2); margin-bottom: 10px;
  }
  .pregunta {
    font-size: 0.87em; color: #2ecc71; background: rgba(46,204,113,0.08);
    padding: 10px 12px; border-radius: 10px; border-left: 3px solid rgba(46,204,113,0.4); margin-bottom: 10px;
  }
  .palabra-nueva {
    font-size: 0.84em; background: rgba(255,215,0,0.08);
    padding: 10px 12px; border-radius: 10px; border-left: 3px solid rgba(255,215,0,0.4);
    color: #ffe066;
  }
  .palabra-nueva strong { color: #ffd700; }
  .audio-btn {
    margin-top: 12px; width: 100%; padding: 8px; border-radius: 10px;
    background: rgba(155,89,182,0.2); border: 1px solid rgba(155,89,182,0.4);
    color: #c39bd3; cursor: pointer; font-size: 0.85em; transition: all 0.3s;
  }
  .audio-btn:hover { background: rgba(155,89,182,0.35); }
  .contador { text-align: center; color: #7a8fa6; margin-bottom: 20px; font-size: 0.88em; }
  .no-results { text-align: center; color: #7a8fa6; padding: 60px; font-size: 1.1em; }
  .empty-state { text-align: center; padding: 80px 20px; }
  .empty-state .emoji { font-size: 4em; margin-bottom: 20px; }
  @media (max-width: 600px) {
    .header h1 { font-size: 1.8em; }
    .cuentos-grid { grid-template-columns: 1fr; }
    .search-bar input { width: 100%; }
  }
</style>
</head>
<body>
<div class="header">
  <div class="stars">⭐ 🌙 ⭐</div>

<script>
const cuentos = [
  {"id": "20260331004600_0", "fecha": "31/03/2026", "lang": "es", "titulo": "Luna, Timo y el dragón de las campanas suaves", "texto": "Luna y Timo subieron la colina con Lin, el pequeño dragón azul, para averiguar por qué el viento sonaba como campanitas. En la hierba hallaron caracoles dormidos con gotitas en la concha. Cada gota vibraba al pasar la brisa y tocaba una nota distinta. Lin quiso estornudar fuego de emoción, pero solo soltó un humito tibio que secó una hoja mojada. Luna rió en voz baja. Timo escuchó y descubrió algo: las gotas grandes sonaban grave y las pequeñas, agudo. Entonces ordenaron los caracoles alrededor de una piedra y, por un minuto, la colina fue una orquesta diminuta. Cuando la luna salió, los tres guardaron el secreto: algunas músicas no se atrapan; solo se visitan antes de dormir.", "traduccion": "", "moraleja": "Buenas noches: lo más bonito también sabe hablar bajito.", "pregunta": "Si tuvieras una campana de viento mágica, ¿qué sonido le pondrías?", "palabra": "", "audio": ""},
  {"id": "20260331004600_1", "fecha": "31/03/2026", "lang": "en", "titulo": "The Moon Map in the Teacup", "texto": "That night, Luna, Timo, and Lin the blue dragon visited Mr. Elio, the island's sleepy cartographer. He looked worried: his moon map had disappeared. They searched quietly until Lin noticed silver light trembling inside a teacup. The map had not vanished at all—it had folded itself into the reflection of the moon. Mr. Elio smiled and explained that old sailors once read directions in water when paper was too precious to waste. Timo held the cup very still. Luna traced the tiny glowing coastlines with her eyes. Lin, trying to help, dipped one claw in and sneezed a puff of warm mist, which made one new island appear. Mr. Elio laughed. “Then tomorrow,” he said, “we shall have somewhere new to wonder about.”", "traduccion": "Esa noche, Luna, Timo y Lin visitaron al señor Elio, un cartógrafo soñoliento. Su mapa de la luna parecía perdido, pero estaba doblado dentro del reflejo de una taza de té. Elio explicó que antiguos marineros leían direcciones en el agua. Lin soltó una nubecita tibia y apareció una isla nueva en el mapa.", "moraleja": "Good night: sometimes the lost thing is only waiting in a quieter place.", "pregunta": "If you found a new island on a moon map, what would you name it?", "palabra": "", "audio": ""},
  {"id": "20260331032116_0", "fecha": "31/03/2026", "lang": "es", "titulo": "El dragón que coleccionaba nubes", "texto": "Había un dragón pequeño llamado Nube que vivía en lo alto de una montaña azul. A diferencia de los otros dragones, él no escupía fuego — escupía nubes de colores. Nubes rosas cuando estaba contento, grises cuando pensaba mucho, y doradas justo antes de dormir. Un día, un niño de un pueblo cercano subió la montaña buscando su cometa perdida. La encontró atrapada en una nube morada. El dragón la liberó soplando suavemente, y la nube se transformó en una estrella. Desde esa noche, el niño siempre miraba el cielo antes de dormir, buscando la estrella morada que le guiñaba el ojo. Y el dragón, que por fin tenía un amigo, dormía tranquilo sabiendo que alguien pensaba en él desde el pueblo.", "traduccion": "", "moraleja": "La amistad más especial nace cuando ayudas sin esperar nada a cambio.", "pregunta": "¿De qué color sería tu nube si pudieras soplar nubes mágicas?", "palabra": "", "audio": ""},
  {"id": "20260331032116_1", "fecha": "31/03/2026", "lang": "en", "titulo": "The Lighthouse Keeper and the Glowing Cat", "texto": "On a tiny island lived an old lighthouse keeper named Theo and his cat, Barnacle. Every night, Theo climbed 99 steps to light the lamp so ships could find their way home. But one stormy night, the lamp went out. Theo was worried — without the light, a ship might get lost. Barnacle, who had never done anything particularly useful before, jumped onto the windowsill and began to glow. Cats from the island had an old secret: when they truly wanted to help, they could shine like small suns. The ship saw the light and arrived safely. From that night on, Barnacle slept curled on top of the lamp, and ships always knew the island was near.", "traduccion": "En una pequeña isla vivía un viejo guardián de faro llamado Theo y su gato Barnacle. Una noche tormentosa el faro se apagó. Barnacle saltó a la ventana y comenzó a brillar — los gatos de la isla tenían un secreto: cuando querían ayudar de verdad, brillaban como pequeños soles. El barco llegó sano y salvo.", "moraleja": "Everyone has a hidden light — it only shines when someone truly needs it.", "pregunta": "If you could glow like Barnacle, when would you use your light?", "palabra": "", "audio": ""},
  {"id": "20260331032116_2", "fecha": "31/03/2026", "lang": "it", "titulo": "La biblioteca sotto il lago", "texto": "In fondo al lago del villaggio, nascosta tra le radici degli alberi, c'era una biblioteca segreta. I pesci erano i bibliotecari e i libri erano fatti di foglie pressate e conchiglie. Una bambina di nome Sofia scoprì la biblioteca un pomeriggio d'autunno, quando buttò una foglia nell'acqua e sparì. Seguendola, trovò migliaia di storie. Il pesce più vecchio le disse che ogni persona ha una storia scritta là dentro — la storia di chi sarà da grande. Sofia aprì il suo libro e trovò solo due parole: Ancora in corso. Tornò a casa sorridendo, perché capì che la parte più bella della storia doveva ancora essere scritta.", "traduccion": "En el fondo del lago había una biblioteca secreta. Los peces eran los bibliotecarios. Una niña llamada Sofía la descubrió siguiendo una hoja que cayó al agua. El pez más viejo le dijo que cada persona tiene una historia escrita allí. Sofía abrió su libro y encontró solo dos palabras: Aún en curso. Volvió a casa sonriendo porque entendió que la mejor parte aún estaba por escribirse.", "moraleja": "La tua storia è ancora in corso — e la parte più bella deve ancora arrivare.", "pregunta": "¿Qué dos palabras encontrarías en tu libro si pudieras leerlo hoy?", "palabra": "", "audio": ""},
  {"id": "20260401000101_0", "fecha": "01/04/2026", "lang": "es", "titulo": "La brújula de las luciérnagas", "texto": "Esa noche, Luna, Timo y Lin el dragón azul descubrieron que el jardín se había llenado de luciérnagas que volaban en círculos, como si buscaran algo importante. Lin, que ya no intentaba parecer feroz a esas horas porque bostezar con colmillos daba muy poca autoridad, observó el cielo y dijo que quizá las pequeñas luces habían perdido el norte. Luna sacó una hoja redonda, la puso sobre el estanque y vio cómo giraba despacio hasta quedarse quieta apuntando hacia el árbol del panal viejo. Timo sonrió: no era magia complicada, era una brújula hecha con paciencia y agua tranquila. Siguieron a las luciérnagas hasta una rama alta donde una de ellas había dejado su primera luz de la noche. Lin alzó a sus amigos con mucho cuidado, recuperaron el brillo perdido y lo devolvieron al grupo. Entonces todas las luciérnagas ordenaron su vuelo y dibujaron una flecha dorada hacia el bosque. Antes de dormir, Luna dijo que orientarse no siempre era correr más rápido; a veces era quedarse quieto el tiempo suficiente para entender hacia dónde ir.", "traduccion": "", "moraleja": "Cuando te detienes con calma, hasta las cosas pequeñas pueden mostrarte el camino.", "pregunta": "Si tuvieras una brújula suave para el corazón, ¿qué crees que te ayudaría a encontrar?", "palabra": "", "audio": ""},
  {"id": "20260401000101_2", "fecha": "01/04/2026", "lang": "it", "titulo": "Il ponte delle ombre gentili", "texto": "Quella sera Luna, Timo e Lin il drago azzurro camminavano accanto al ruscello quando videro un ponte di pietra coperto da ombre strane. Non erano ombre spaventose: sembravano più ombre timide, che non sapevano bene dove stare quando la luna diventava molto luminosa. Timo provò a salutarle con la mano. Una di loro fece lo stesso, ma con un piccolo ritardo, come se stesse ancora imparando il mestiere di essere ombra. Lin rise così piano che sembrò un tuono educato. Luna osservò che il ponte era illuminato da una sola lanterna, troppo forte da un lato e troppo debole dall’altro. Così i tre spostarono la lanterna al centro e Lin lucidò il vetro con la punta della coda. Allora le ombre si distesero in modo morbido e ordinato sulle pietre, come coperte leggere. Il ponte tornò bellissimo: metà luce, metà riposo. Prima di rientrare, Luna disse che anche le ombre hanno bisogno del loro posto, perché la notte non è fatta solo per brillare, ma anche per riposare senza fretta. Le ombre, questa volta puntualissime, annuirono tutte insieme.", "traduccion": "Luna, Timo y Lin encontraron un puente con sombras tímidas. Al mover una linterna al centro, la luz quedó equilibrada y las sombras descansaron en paz. Aprendieron que en la noche también hay espacio para lo suave y lo tranquilo.", "moraleja": "La luce più bella è quella che lascia spazio anche alla calma.", "pregunta": "Se pudieras acomodar una luz en tu cuarto, ¿dónde la pondrías para que todo se sienta en paz?", "palabra": "", "audio": ""},
  {"id": "20260401000201_0", "fecha": "01/04/2026", "lang": "es", "titulo": "La brújula de rocío de Lin", "texto": "Esa noche, Luna, Timo y Lin el dragón azul subieron a la colina para ver cómo el rocío convertía el pasto en un mapa brillante. Lin llevaba una pequeña brújula hecha con una hoja seca y una gota redonda, invento de Timo, que aseguraba apuntar siempre hacia los lugares tranquilos. La brújula giró una vez, dos veces, y terminó señalando un caracol dormido dentro de una flor de campana. Luna se rió bajito. “Parece que el lugar más tranquilo del bosque mide dos centímetros”. Para no despertarlo, los tres caminaron de puntillas alrededor de la flor. En el camino descubrieron que cada gotita de rocío reflejaba una estrella distinta, como si el cielo hubiera dejado copias pequeñitas para quien mirara con paciencia. Timo quiso contarlas todas, pero a la número doce bostezó tan fuerte que hasta la brújula tembló. Lin sopló un aire tibio para secar una piedra y sentarse allí. Entonces Luna les enseñó a escuchar sin hablar: primero el viento, luego los grillos, luego su propia respiración. La brújula dejó de moverse. “Ya entendí”, susurró Timo. “No busca un lugar tranquilo; busca cuándo nosotros nos volvemos tranquilos”. Lin asintió, orgulloso, como si la brújula hubiera sido idea suya desde el principio. El caracol siguió dormido. Las estrellas siguieron arriba. Y los tres volvieron a casa con los zapatos un poco mojados y el corazón bien sereno.", "traduccion": "", "moraleja": "A veces la calma no se encuentra lejos: aparece cuando bajamos la prisa y aprendemos a escuchar.", "pregunta": "Si tuvieras una brújula de tranquilidad, ¿a qué lugar crees que te llevaría?", "palabra": "", "audio": ""},
  {"id": "20260401000201_1", "fecha": "01/04/2026", "lang": "en", "titulo": "The Library of Quiet Feathers", "texto": "The next evening, Luna, Timo, and Lin the blue dragon followed a trail of white feathers that floated through the meadow as if they were remembering where to go. At the end of the path they found a tiny night library built inside an old willow tree. No one was allowed to shout there, not because of rules, but because the books were sleeping birds and loud voices made them flutter in their dreams. A small owl librarian welcomed them with a nod so serious that Timo had to bite his lip to keep from laughing. Lin carefully opened one silver-blue book with the tip of a claw. Inside, instead of letters, there were moon shapes, shells, and little drawings of tides. Luna explained that some stories teach with words, and others teach by patterns. Together they discovered the book was about how the moon helps the sea move, gently pulling the water the way a mother straightens a blanket. Timo whispered that the moon must be very strong to tidy up an entire ocean. “Strong and patient,” said Luna. Lin tried whispering too, but dragons are not natural whisperers; his whisper sounded like a teapot thinking hard. Even the owl smiled. Before leaving, each of them placed one feather on the library windowsill as a promise to return quietly. On the walk home, Timo looked at the moon and said he liked knowing that even faraway things could help without making noise. Lin agreed, then yawned a blue, polite yawn that almost looked like a cloud. By the time they reached their door, the night felt soft, ordered, and ready for sleep.", "traduccion": "Luna, Timo y Lin siguieron un rastro de plumas hasta una biblioteca nocturna dentro de un sauce. Allí descubrieron un libro que enseñaba, con dibujos y formas, cómo la luna mueve suavemente las mareas. Timo aprendió que también se puede ayudar en silencio, y Lin intentó susurrar… aunque sonó como una tetera pensativa.", "moraleja": "Real strength can be gentle, patient, and quiet.", "pregunta": "What quiet thing do you think helps the world every night?", "palabra": "", "audio": ""},
  {"id": "20260401000201_2", "fecha": "01/04/2026", "lang": "it", "titulo": "Il ponte delle lucciole pazienti", "texto": "La terza sera, Luna, Timo e Lin il drago azzurro trovarono un ruscello un po’ più largo del solito. Non faceva paura, ma faceva abbastanza rumore da confondere i pensieri piccoli prima di dormire. “Ci serve un ponte,” disse Timo. “O gambe più lunghe,” aggiunse Lin, guardando le proprie con una certa speranza. Luna osservò l’acqua e notò che sopra il ruscello volavano lucciole in file ordinate, come minuscole lanterne che si davano il turno. Con molta calma, le lucciole si posarono una accanto all’altra su alcuni sassi chiari, formando una strada luminosa. Non era magia frettolosa: era un lavoro preciso, quasi matematico. Luna spiegò che quando qualcosa sembra difficile, a volte basta dividerlo in piccoli passi. Timo fece il primo passo, poi il secondo, contando piano per non perdere il coraggio. Lin passò per ultimo, con tanta delicatezza che il ponte di lucciole tremò appena, come se stesse ridendo. Dall’altra parte trovarono un cespuglio di menta selvatica, e l’aria profumò di fresco e notte pulita. Timo dichiarò che quel profumo meritava una medaglia. Lin disse che preferiva una almohada. Luna raccolse una foglia de menta e la mise nel taschino del pigiama “per ricordare al sonno la strada di casa”. Le lucciole si spensero una a una, fiere del loro lavoro ben fatto. Tornando indietro, i tre non avevano più fretta. Avevano imparato che anche un ponte minuscolo può portare molto lontano, soprattutto se lo attraversi con pazienza.", "traduccion": "Luna, Timo y Lin encontraron un arroyo y unas luciérnagas formaron un puente luminoso sobre las piedras. Luna explicó que lo difícil se resuelve mejor en pasos pequeños. Timo cruzó contando despacio, Lin con mucha delicadeza, y al otro lado hallaron menta silvestre y una noche aún más tranquila.", "moraleja": "Le cose difficili diventano leggere quando le affronti un passo alla volta.", "pregunta": "¿Qué cosa te saldría mejor si la hicieras despacito, paso por paso?", "palabra": "", "audio": ""}
];

// Obtener fechas únicas para filtros
const fechasUnicas = [...new Set(cuentos.map(c => c.fecha))].sort((a,b) => {
  const pa = a.split('/'), pb = b.split('/');
  return new Date(pb[2],pb[1]-1,pb[0]) - new Date(pa[2],pa[1]-1,pa[0]);
});

// Construir filtros de fecha
const fdiv = document.getElementById('filtros-fecha');
const btnTodas = document.createElement('button');
btnTodas.className = 'filter-btn active';
btnTodas.textContent = 'Todas';
btnTodas.onclick = function(){ setFiltro('fecha','todas',this); };
fdiv.appendChild(btnTodas);
fechasUnicas.forEach(f => {
  const b = document.createElement('button');
  b.className = 'filter-btn';
  const partes = f.split('/');
  b.textContent = partes[0]+'/'+partes[1];
  b.onclick = function(){ setFiltro('fecha',f,this); };
  fdiv.appendChild(b);
});

let filtros = { lang: 'todos', fecha: 'todas' };

function setFiltro(tipo, val, el) {
  filtros[tipo] = val;
  const grupo = tipo === 'lang' ? 'filtros-idioma' : 'filtros-fecha';
  document.getElementById(grupo).querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  filtrar();
}

function getImgUrl(c) {
  const keywords = encodeURIComponent(
    c.titulo.split(' ').slice(0,4).join(',') + ',' +
    (c.lang === 'es' ? 'night,story,children' : c.lang === 'en' ? 'fantasy,night,magic' : 'luna,notte,bambini')
  );
  return 'https://source.unsplash.com/800x450/?' + keywords + '&sig=' + c.id.replace(/[^a-z0-9]/gi,'');
}

function getPalette(c) {
  const seed = c.id.charCodeAt(0) + c.titulo.charCodeAt(0);
  const palettes = [
    {bg:'#0a0a1e',accent:'#9b59b6'},{bg:'#0d1b2a',accent:'#3498db'},
    {bg:'#1a0800',accent:'#e74c3c'},{bg:'#001a0d',accent:'#27ae60'},
    {bg:'#1a001a',accent:'#e91e63'},{bg:'#001a1a',accent:'#00bcd4'}
  ];
  return palettes[seed % palettes.length];
}

function renderImagen(c) {
  const p = getPalette(c);
  const emoji = c.lang === 'es' ? '🌙' : c.lang === 'en' ? '⭐' : '✨';
  return '<div class="cuento-img-placeholder" style="background:linear-gradient(135deg,'+p.accent+'33,'+p.bg+')">' + emoji + '</div>';
}

function renderPalabra(c) {
  if (!c.palabra) return '';
  return '<div class="palabra-nueva"><strong>📚 Palabra nueva:</strong> ' + c.palabra + '</div>';
}

function renderAudio(c) {
  if (!c.audio) return '';
  return '<button class="audio-btn" onclick="playAudio(\'' + c.audio + '\')">🔊 Escuchar el cuento</button>';
}

function playAudio(url) {
  const a = new Audio(url);
  a.play();
}

function filtrar() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  let r = cuentos;
  if (filtros.lang !== 'todos') r = r.filter(c => c.lang === filtros.lang);
  if (filtros.fecha !== 'todas') r = r.filter(c => c.fecha === filtros.fecha);
  if (q) r = r.filter(c => c.titulo.toLowerCase().includes(q) || c.texto.toLowerCase().includes(q));

  const byDate = {};
  r.forEach(c => { if (!byDate[c.fecha]) byDate[c.fecha] = []; byDate[c.fecha].push(c); });
  const lib = document.getElementById('biblioteca');
  const fechas = Object.keys(byDate).sort((a,b) => {
    const pa = a.split('/'), pb = b.split('/');
    return new Date(pb[2],pb[1]-1,pb[0]) - new Date(pa[2],pa[1]-1,pa[0]);
  });

  if (cuentos.length === 0) {
    lib.innerHTML = '<div class="empty-state"><div class="emoji">🌙</div><p>Los primeros cuentos llegarán esta noche...</p></div>';
    document.getElementById('contador').textContent = '';
    return;
  }
  if (fechas.length === 0) {
    lib.innerHTML = '<div class="no-results">🌙 No se encontraron cuentos...</div>';
    document.getElementById('contador').textContent = '';
    return;
  }

  document.getElementById('contador').textContent = r.length + ' cuento' + (r.length !== 1 ? 's' : '') + ' en la biblioteca';

  lib.innerHTML = fechas.map(fecha =>
    '<div class="date-group">' +
    '<div class="date-label">🌙 ' + fecha + '</div>' +
    '<div class="cuentos-grid">' +
    byDate[fecha].map(c =>
      '<div class="cuento-card">' +
      '<div class="img-wrap">' + renderImagen(c) +
      '<div class="lang-overlay overlay-' + c.lang + '">' +
      (c.lang === 'es' ? '🇪🇸 Español' : c.lang === 'en' ? '🇬🇧 English' : '🇮🇹 Italiano') +
      '</div></div>' +
      '<div class="cuento-body">' +
      '<div class="cuento-titulo">' + c.titulo + '</div>' +
      '<div class="cuento-texto">' + c.texto + '</div>' +
      (c.traduccion ? '<div class="traduccion">📖 <strong>Traducción:</strong><br>' + c.traduccion + '</div>' : '') +
      (c.moraleja ? '<div class="moraleja">✨ ' + c.moraleja + '</div>' : '') +
      (c.pregunta ? '<div class="pregunta">🎯 ' + c.pregunta + '</div>' : '') +
      renderPalabra(c) +
      renderAudio(c) +
      '</div></div>'
    ).join('') +
    '</div></div>'
  ).join('');
}

filtrar();
</script>
</body>
</html>
