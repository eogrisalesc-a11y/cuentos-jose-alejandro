<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌙 Cuentos de José Alejandro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #fff8f0;
    --bg-2: #ffe8d6;
    --bg-3: #e8d5ff;
    --bg-4: #d4f1ff;
    --ink: #3d2e5f;
    --ink-soft: #7a6b99;
    --primary: #ff6b9d;
    --primary-soft: #ffb3cf;
    --accent: #ffc542;
    --accent-soft: #ffe49a;
    --es: #ff6b6b;
    --en: #4db8e8;
    --it: #6fcf97;
    --purple: #b084eb;
    --card-bg: #ffffff;
    --shadow: 0 10px 35px rgba(61, 46, 95, 0.12);
    --shadow-hover: 0 20px 50px rgba(61, 46, 95, 0.2);
    --radius: 28px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Quicksand', -apple-system, sans-serif;
    background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 25%, var(--bg-3) 60%, var(--bg-4) 100%);
    background-attachment: fixed;
    min-height: 100vh;
    padding: 20px 16px;
    color: var(--ink);
    line-height: 1.65;
    font-weight: 500;
  }
  .container { max-width: 1240px; margin: 0 auto; }

  /* FLOATING STARS BACKGROUND */
  .stars-bg {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      radial-gradient(1.5px 1.5px at 20% 30%, rgba(255, 197, 66, 0.4), transparent),
      radial-gradient(1px 1px at 60% 70%, rgba(176, 132, 235, 0.3), transparent),
      radial-gradient(1.5px 1.5px at 80% 20%, rgba(255, 107, 157, 0.35), transparent),
      radial-gradient(1px 1px at 30% 80%, rgba(77, 184, 232, 0.3), transparent);
    background-size: 400px 400px;
    animation: starsFloat 30s linear infinite;
  }
  @keyframes starsFloat {
    0% { background-position: 0 0, 0 0, 0 0, 0 0; }
    100% { background-position: 400px 400px, -400px 400px, 400px -400px, -400px -400px; }
  }
  .container { position: relative; z-index: 1; }

  /* HEADER */
  .header { text-align: center; padding: 40px 20px 30px; }
  .header .moons { font-size: 3em; letter-spacing: 18px; margin-bottom: 12px; animation: bounce 3s ease-in-out infinite; }
  @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .header h1 {
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: clamp(2em, 5vw, 3.4em);
    margin-bottom: 12px;
    letter-spacing: -0.01em;
  }
  .header h1 .nombre {
    background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 50%, var(--purple) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header .subtitle {
    color: var(--ink-soft);
    font-size: 1.05em;
    font-weight: 500;
  }
  .header .subtitle .dot { color: var(--primary); margin: 0 10px; font-weight: 700; }

  /* PROGRESS BAR SEMANAL */
  .week-progress {
    max-width: 560px;
    margin: 20px auto;
    background: rgba(255, 255, 255, 0.6);
    border-radius: 32px;
    padding: 14px 20px;
    box-shadow: var(--shadow);
  }
  .week-progress-label {
    font-size: 0.8em;
    color: var(--ink-soft);
    text-align: center;
    margin-bottom: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .week-days {
    display: flex;
    justify-content: space-between;
    gap: 6px;
  }
  .week-day {
    flex: 1;
    text-align: center;
    padding: 8px 4px;
    border-radius: 14px;
    font-size: 0.78em;
    font-weight: 600;
    color: var(--ink-soft);
    background: rgba(255, 255, 255, 0.5);
    transition: all 0.3s;
  }
  .week-day.done {
    background: linear-gradient(135deg, var(--primary-soft), var(--accent-soft));
    color: var(--ink);
  }
  .week-day.today {
    background: linear-gradient(135deg, var(--primary), var(--accent));
    color: white;
    transform: scale(1.08);
    box-shadow: 0 4px 14px rgba(255, 107, 157, 0.4);
  }

  /* SEARCH */
  .search-bar { display: flex; justify-content: center; margin: 26px 0 16px; }
  .search-bar input {
    padding: 14px 26px;
    border-radius: 32px;
    border: 2px solid rgba(176, 132, 235, 0.3);
    background: var(--card-bg);
    color: var(--ink);
    font-size: 1em;
    font-family: inherit;
    font-weight: 500;
    width: min(420px, 90%);
    outline: none;
    box-shadow: var(--shadow);
    transition: all 0.3s;
  }
  .search-bar input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 5px rgba(255, 107, 157, 0.15);
  }
  .search-bar input::placeholder { color: var(--ink-soft); font-weight: 500; }

  /* FILTERS */
  .filter-section { text-align: center; margin: 14px 0; }
  .filter-label {
    font-size: 0.75em;
    color: var(--ink-soft);
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 700;
  }
  .filters {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .filter-btn {
    padding: 11px 22px;
    border-radius: 32px;
    border: 2px solid rgba(176, 132, 235, 0.25);
    background: rgba(255, 255, 255, 0.8);
    color: var(--purple);
    cursor: pointer;
    font-size: 0.88em;
    font-family: inherit;
    font-weight: 600;
    transition: all 0.25s;
  }
  .filter-btn:hover {
    background: rgba(176, 132, 235, 0.1);
    transform: translateY(-2px);
  }
  .filter-btn.active {
    background: linear-gradient(135deg, var(--primary), var(--purple));
    color: white;
    border-color: transparent;
    box-shadow: 0 6px 18px rgba(255, 107, 157, 0.35);
  }

  .contador {
    text-align: center;
    color: var(--ink-soft);
    margin: 24px 0;
    font-size: 0.92em;
    font-weight: 500;
  }

  /* DATE GROUPS */
  .date-group { margin-bottom: 50px; }
  .date-label {
    font-family: 'Fredoka', sans-serif;
    font-size: 1.5em;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 26px;
    padding: 16px 26px;
    background: linear-gradient(90deg, var(--accent-soft), rgba(255, 197, 66, 0.05));
    border-left: 6px solid var(--accent);
    border-radius: 0 20px 20px 0;
    display: inline-block;
  }

  /* GRID */
  .cuentos-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
    gap: 28px;
  }

  /* CARD */
  .cuento-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    overflow: hidden;
    border: 2px solid rgba(176, 132, 235, 0.1);
    box-shadow: var(--shadow);
    transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.2), box-shadow 0.4s;
    display: flex;
    flex-direction: column;
  }
  .cuento-card:hover {
    transform: translateY(-6px);
    box-shadow: var(--shadow-hover);
  }
  .img-wrap { position: relative; }
  .cuento-img {
    width: 100%;
    height: 240px;
    object-fit: cover;
    display: block;
  }
  .cuento-img-placeholder {
    width: 100%;
    height: 240px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 5em;
    background: linear-gradient(135deg, var(--bg-3), var(--bg-4));
  }
  .lang-overlay {
    position: absolute;
    top: 16px;
    left: 16px;
    padding: 8px 16px;
    border-radius: 24px;
    font-size: 0.8em;
    font-weight: 700;
    color: white;
    backdrop-filter: blur(10px);
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
  }
  .overlay-es { background: rgba(255, 107, 107, 0.92); }
  .overlay-en { background: rgba(77, 184, 232, 0.92); }
  .overlay-it { background: rgba(111, 207, 151, 0.92); }

  /* BODY */
  .cuento-body { padding: 28px; flex: 1; display: flex; flex-direction: column; }
  .cuento-titulo {
    font-family: 'Fredoka', sans-serif;
    font-size: 1.45em;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 18px;
    line-height: 1.3;
  }
  .cuento-texto {
    font-size: 1.05em;
    color: var(--ink);
    line-height: 1.9;
    margin-bottom: 22px;
    font-weight: 500;
  }

  /* KARAOKE highlight */
  .word {
    transition: color 0.12s, background 0.12s, transform 0.12s;
    padding: 1px 2px;
    border-radius: 6px;
    display: inline-block;
  }
  .word.active {
    background: linear-gradient(135deg, var(--accent), #ffda70);
    color: var(--ink);
    font-weight: 700;
    transform: scale(1.08);
    box-shadow: 0 4px 12px rgba(255, 197, 66, 0.4);
  }
  .word.passed { color: var(--ink-soft); opacity: 0.85; }

  /* CUSTOM AUDIO PLAYER */
  .audio-wrap { margin-top: 18px; }
  .audio-label {
    font-size: 0.82em;
    color: var(--ink-soft);
    margin-bottom: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .audio-player {
    background: linear-gradient(135deg, var(--bg-2), var(--bg-3));
    border-radius: 24px;
    padding: 16px 18px;
    border: 2px solid rgba(176, 132, 235, 0.15);
  }
  .audio-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .audio-btn {
    background: white;
    border: none;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1.1em;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 12px rgba(61, 46, 95, 0.15);
    transition: all 0.2s;
    color: var(--primary);
    flex-shrink: 0;
  }
  .audio-btn:hover { transform: scale(1.1); background: var(--primary); color: white; }
  .audio-btn.play-big {
    width: 56px;
    height: 56px;
    font-size: 1.5em;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    color: white;
  }
  .audio-btn.play-big:hover { background: linear-gradient(135deg, var(--accent), var(--primary)); }
  .audio-progress-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .audio-progress {
    height: 8px;
    background: rgba(255, 255, 255, 0.7);
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    position: relative;
  }
  .audio-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary), var(--accent));
    border-radius: 8px;
    width: 0%;
    transition: width 0.1s linear;
  }
  .audio-time {
    font-size: 0.78em;
    color: var(--ink-soft);
    display: flex;
    justify-content: space-between;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }
  .audio-speed {
    background: white;
    border: none;
    padding: 5px 12px;
    border-radius: 14px;
    font-size: 0.78em;
    font-weight: 700;
    color: var(--primary);
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(61, 46, 95, 0.12);
  }
  .audio-speed:hover { background: var(--primary); color: white; }

  /* SECTIONS */
  .traduccion {
    background: rgba(77, 184, 232, 0.1);
    border-radius: 18px;
    padding: 16px 20px;
    margin-bottom: 14px;
    font-size: 0.95em;
    color: var(--ink-soft);
    border-left: 5px solid var(--en);
    line-height: 1.7;
    font-weight: 500;
  }
  .moraleja {
    font-family: 'Fredoka', sans-serif;
    font-size: 1.05em;
    color: var(--purple);
    font-weight: 500;
    padding: 14px 0;
    border-top: 2px dashed rgba(176, 132, 235, 0.3);
    margin-bottom: 14px;
    text-align: center;
  }
  .pregunta {
    font-size: 0.96em;
    color: var(--it);
    background: rgba(111, 207, 151, 0.1);
    padding: 16px 20px;
    border-radius: 18px;
    border-left: 5px solid var(--it);
    margin-bottom: 14px;
    font-weight: 500;
  }
  .palabra-nueva {
    font-size: 0.92em;
    background: linear-gradient(135deg, rgba(255, 197, 66, 0.15), rgba(255, 197, 66, 0.05));
    padding: 14px 20px;
    border-radius: 18px;
    border-left: 5px solid var(--accent);
    color: var(--ink);
    margin-bottom: 14px;
    font-weight: 600;
  }

  /* SLEEP TIMER BAR */
  .sleep-timer {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: white;
    border-radius: 32px;
    padding: 10px 18px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 100;
    font-size: 0.85em;
    font-weight: 600;
    color: var(--ink-soft);
    border: 2px solid var(--primary-soft);
  }
  .sleep-timer button {
    background: transparent;
    border: none;
    cursor: pointer;
    font-size: 1em;
    color: var(--primary);
    padding: 4px 8px;
    border-radius: 10px;
    font-weight: 700;
  }
  .sleep-timer button:hover { background: var(--primary-soft); }
  .sleep-timer.active { border-color: var(--primary); }

  /* EMPTY STATES */
  .no-results, .empty-state, .loading {
    text-align: center;
    color: var(--ink-soft);
    padding: 80px 20px;
  }
  .empty-state .moon-big { font-size: 5em; margin-bottom: 20px; }
  .loading { font-size: 1.05em; }

  /* FOOTER */
  .footer {
    text-align: center;
    color: var(--ink-soft);
    padding: 40px 20px 20px;
    font-size: 0.88em;
    margin-top: 40px;
    font-weight: 500;
  }
  .footer .heart { color: var(--es); font-size: 1.1em; }

  @media (max-width: 600px) {
    body { padding: 14px 10px; }
    .header { padding: 26px 10px 18px; }
    .header .moons { font-size: 2.4em; letter-spacing: 12px; }
    .cuentos-grid { grid-template-columns: 1fr; gap: 22px; }
    .cuento-body { padding: 22px; }
    .cuento-titulo { font-size: 1.25em; }
    .audio-btn { width: 40px; height: 40px; }
    .audio-btn.play-big { width: 52px; height: 52px; }
    .sleep-timer { bottom: 16px; right: 16px; padding: 8px 14px; font-size: 0.78em; }
    .week-days { gap: 4px; }
    .week-day { padding: 6px 2px; font-size: 0.7em; }
  }
</style>
</head>
<body>
<div class="stars-bg"></div>
<div class="container">
  <div class="header">
    <div class="moons">🌙 ⭐ 🌙</div>
    <h1>Cuentos de <span class="nombre">José Alejandro</span></h1>
    <p class="subtitle">Una aventura mágica cada noche<span class="dot">·</span>Español<span class="dot">·</span>English<span class="dot">·</span>Italiano</p>
  </div>

  <div class="week-progress" id="weekProgress">
    <div class="week-progress-label">✨ Saga de esta semana</div>
    <div class="week-days" id="weekDays"></div>
  </div>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="🔍 Buscar cuento..." oninput="filtrar()">
  </div>

  <div class="filter-section">
    <div class="filter-label">Idioma</div>
    <div class="filters" id="filtros-idioma">
      <button class="filter-btn active" onclick="setFiltro('lang','todos',this)">Todos</button>
      <button class="filter-btn" onclick="setFiltro('lang','es',this)">🇪🇸 Español</button>
      <button class="filter-btn" onclick="setFiltro('lang','en',this)">🇬🇧 English</button>
      <button class="filter-btn" onclick="setFiltro('lang','it',this)">🇮🇹 Italiano</button>
    </div>
  </div>

  <div class="filter-section">
    <div class="filter-label">Fecha</div>
    <div class="filters" id="filtros-fecha"></div>
  </div>

  <div class="contador" id="contador"></div>
  <div id="biblioteca"><div class="loading">🌙 Cargando cuentos...</div></div>

  <div class="footer">
    Hecho con <span class="heart">♥</span> para José Alejandro · Generado por Ángel
  </div>
</div>

<!-- Sleep Timer UI -->
<div class="sleep-timer" id="sleepTimer" style="display:none;">
  <span id="sleepTimerLabel">💤 Apaga en 10:00</span>
  <button onclick="cancelSleepTimer()">✕</button>
</div>

<script>
let cuentos = [];
let filtros = { lang: "todos", fecha: "todas" };
let sleepTimerHandle = null;
let sleepTimerSeconds = 0;
let activeAudios = [];

function deriveFechaFromId(id) {
  const m = (id || "").match(/^(\d{4})(\d{2})(\d{2})_\d+_(es|en|it)$/);
  return m ? (m[3] + "/" + m[2] + "/" + m[1]) : "";
}

fetch("cuentos.json?" + Date.now())
  .then(r => r.json())
  .then(data => {
    cuentos = data;
    cuentos.forEach(c => {
      if (!c.fecha || !/^\d{2}\/\d{2}\/\d{4}$/.test(c.fecha)) {
        const derived = deriveFechaFromId(c.id);
        if (derived) c.fecha = derived;
      }
    });
    renderWeekProgress();
    iniciarFiltrosFecha();
    filtrar();
  })
  .catch(e => {
    document.getElementById("biblioteca").innerHTML =
      '<div class="empty-state"><div class="moon-big">🌙</div><p>Los primeros cuentos llegarán esta noche...</p></div>';
  });

// === PROGRESO SEMANAL ===
function renderWeekProgress() {
  const wp = document.getElementById("weekDays");
  if (!wp) return;
  const today = new Date();
  const dayOfWeek = today.getDay(); // 0=dom
  // Semana empieza lunes
  const monday = new Date(today);
  monday.setDate(today.getDate() - ((dayOfWeek + 6) % 7));
  const labels = ["L", "M", "X", "J", "V", "S", "D"];
  wp.innerHTML = "";
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    const dd = String(d.getDate()).padStart(2, "0");
    const mm = String(d.getMonth() + 1).padStart(2, "0");
    const yyyy = d.getFullYear();
    const fecha = dd + "/" + mm + "/" + yyyy;
    const has = cuentos.some(c => c.fecha === fecha);
    const isToday = d.toDateString() === today.toDateString();
    const div = document.createElement("div");
    div.className = "week-day" + (has ? " done" : "") + (isToday ? " today" : "");
    div.innerHTML = labels[i] + "<br>" + dd;
    wp.appendChild(div);
  }
}

function iniciarFiltrosFecha() {
  const fechasUnicas = [...new Set(cuentos.map(c => c.fecha))].sort((a, b) => {
    const pa = a.split("/"), pb = b.split("/");
    return new Date(pb[2], pb[1] - 1, pb[0]) - new Date(pa[2], pa[1] - 1, pa[0]);
  });
  const fdiv = document.getElementById("filtros-fecha");
  fdiv.innerHTML = "";
  const btnTodas = document.createElement("button");
  btnTodas.className = "filter-btn active";
  btnTodas.textContent = "Todas";
  btnTodas.onclick = function() { setFiltro("fecha", "todas", this); };
  fdiv.appendChild(btnTodas);
  fechasUnicas.forEach(f => {
    const b = document.createElement("button");
    b.className = "filter-btn";
    const p = f.split("/");
    b.textContent = p[0] + "/" + p[1];
    b.onclick = function() { setFiltro("fecha", f, this); };
    fdiv.appendChild(b);
  });
}

function setFiltro(tipo, val, el) {
  filtros[tipo] = val;
  const grupo = tipo === "lang" ? "filtros-idioma" : "filtros-fecha";
  document.querySelectorAll("#" + grupo + " .filter-btn").forEach(b => b.classList.remove("active"));
  if (el) el.classList.add("active");
  filtrar();
}

// === KARAOKE (sin auto-scroll en móvil) ===
// Usa el TEXTO ORIGINAL con puntuación perfecta para el display,
// y solo los timestamps de Whisper para sincronizar el highlight.
// Whisper devuelve palabras sin puntuación y a veces con errores de transcripción;
// el texto original del JSON es la fuente de verdad visual.
function buildKaraokeText(textoEl, c) {
  if (!c.words || !c.words.length) {
    textoEl.textContent = c.texto;
    return null;
  }

  // Tokenizar el texto original preservando puntuación y párrafos
  const texto = c.texto || "";
  const lines = texto.split(/\n\n+/);
  const allTokens = [];
  lines.forEach((line, li) => {
    const tokens = line.trim().split(/\s+/).filter(Boolean);
    tokens.forEach(t => allTokens.push({ text: t, newPara: false }));
    if (li < lines.length - 1 && allTokens.length > 0) {
      allTokens[allTokens.length - 1].newPara = true;
    }
  });

  const wCount = c.words.length;
  const tCount = allTokens.length;
  if (tCount === 0) {
    textoEl.textContent = texto;
    return null;
  }

  // Si Whisper capturó más words que tokens del texto, probablemente incluyó título
  // o "Fin.". Detectar offset buscando el primer word de Whisper que matchee con la
  // primera palabra significativa del texto (normalizada).
  const normalizar = s => (s || "").toLowerCase().replace(/[^a-záéíóúñü]/gi, "");
  let offset = 0;
  if (wCount > tCount) {
    const firstTokNorm = normalizar(allTokens[0].text);
    for (let i = 0; i < Math.min(wCount - tCount + 5, wCount); i++) {
      if (normalizar(c.words[i].w) === firstTokNorm ||
          normalizar(c.words[i].w).startsWith(firstTokNorm.slice(0, 4))) {
        offset = i;
        break;
      }
    }
  }
  const usableWCount = wCount - offset;

  textoEl.innerHTML = "";
  allTokens.forEach((tok, i) => {
    const span = document.createElement("span");
    span.className = "word";
    // Mapear índice del token → word de Whisper (con offset corregido)
    const wIdx = Math.min(offset + Math.floor(i * usableWCount / tCount), wCount - 1);
    const wd = c.words[wIdx];
    span.dataset.idx = i;
    span.dataset.t0 = wd.t0;
    span.dataset.t1 = wd.t1;
    span.textContent = tok.text;
    textoEl.appendChild(span);
    if (i < allTokens.length - 1) {
      if (tok.newPara) {
        textoEl.appendChild(document.createElement("br"));
        textoEl.appendChild(document.createElement("br"));
      } else {
        textoEl.appendChild(document.createTextNode(" "));
      }
    }
  });
  return textoEl.querySelectorAll(".word");
}

function attachKaraoke(audioEl, words) {
  if (!words || !words.length) return;
  let lastIdx = -1;
  audioEl.addEventListener("timeupdate", () => {
    const t = audioEl.currentTime;
    let idx = -1;
    for (let i = 0; i < words.length; i++) {
      const t0 = parseFloat(words[i].dataset.t0);
      const t1 = parseFloat(words[i].dataset.t1);
      if (t >= t0 && t <= t1 + 0.05) { idx = i; break; }
      if (t < t0) break;
    }
    if (idx === lastIdx) return;
    if (lastIdx >= 0 && words[lastIdx]) words[lastIdx].classList.remove("active");
    if (idx >= 0 && words[idx]) {
      words[idx].classList.add("active");
      for (let i = 0; i < idx; i++) words[i].classList.add("passed");
      // NO auto-scroll: el usuario controla su scroll libremente
    }
    lastIdx = idx;
  });
  audioEl.addEventListener("ended", () => {
    words.forEach(w => w.classList.remove("active"));
  });
  audioEl.addEventListener("seeked", () => {
    const t = audioEl.currentTime;
    words.forEach((w) => {
      const t1 = parseFloat(w.dataset.t1);
      if (t < t1) w.classList.remove("passed");
    });
  });
}

// === CUSTOM AUDIO PLAYER ===
function fmtTime(s) {
  if (isNaN(s) || s < 0) s = 0;
  const m = Math.floor(s / 60);
  const ss = Math.floor(s % 60);
  return m + ":" + String(ss).padStart(2, "0");
}

function createAudioPlayer(src, wordSpans) {
  const wrap = document.createElement("div");
  wrap.className = "audio-player";

  const audio = document.createElement("audio");
  audio.src = src;
  audio.preload = "metadata";
  wrap.appendChild(audio);
  activeAudios.push(audio);

  const controls = document.createElement("div");
  controls.className = "audio-controls";

  // Botón -10s
  const back = document.createElement("button");
  back.className = "audio-btn";
  back.innerHTML = "⏪";
  back.title = "Retroceder 10s";
  back.onclick = () => { audio.currentTime = Math.max(0, audio.currentTime - 10); };

  // Botón play/pause
  const play = document.createElement("button");
  play.className = "audio-btn play-big";
  play.innerHTML = "▶";
  play.onclick = () => {
    // Pausar otros audios activos antes de reproducir este
    activeAudios.forEach(a => { if (a !== audio && !a.paused) a.pause(); });
    if (audio.paused) audio.play(); else audio.pause();
  };
  audio.addEventListener("play", () => { play.innerHTML = "⏸"; });
  audio.addEventListener("pause", () => { play.innerHTML = "▶"; });
  audio.addEventListener("ended", () => { play.innerHTML = "▶"; });

  // Botón +10s
  const fwd = document.createElement("button");
  fwd.className = "audio-btn";
  fwd.innerHTML = "⏩";
  fwd.title = "Adelantar 10s";
  fwd.onclick = () => { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 10); };

  // Progress + time
  const progWrap = document.createElement("div");
  progWrap.className = "audio-progress-wrap";
  const prog = document.createElement("div");
  prog.className = "audio-progress";
  const fill = document.createElement("div");
  fill.className = "audio-progress-fill";
  prog.appendChild(fill);
  prog.onclick = (e) => {
    const rect = prog.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    if (audio.duration) audio.currentTime = pct * audio.duration;
  };
  const time = document.createElement("div");
  time.className = "audio-time";
  const tCur = document.createElement("span"); tCur.textContent = "0:00";
  const tTot = document.createElement("span"); tTot.textContent = "0:00";
  time.appendChild(tCur);
  time.appendChild(tTot);
  progWrap.appendChild(prog);
  progWrap.appendChild(time);

  audio.addEventListener("loadedmetadata", () => { tTot.textContent = fmtTime(audio.duration); });
  audio.addEventListener("timeupdate", () => {
    if (audio.duration) fill.style.width = (audio.currentTime / audio.duration * 100) + "%";
    tCur.textContent = fmtTime(audio.currentTime);
  });

  // Speed
  const speed = document.createElement("button");
  speed.className = "audio-speed";
  speed.textContent = "1x";
  const speeds = [1, 0.85, 0.75, 1.15];
  let sIdx = 0;
  speed.onclick = () => {
    sIdx = (sIdx + 1) % speeds.length;
    audio.playbackRate = speeds[sIdx];
    speed.textContent = speeds[sIdx] + "x";
  };

  controls.appendChild(back);
  controls.appendChild(play);
  controls.appendChild(fwd);
  controls.appendChild(progWrap);
  controls.appendChild(speed);
  wrap.appendChild(controls);

  if (wordSpans) attachKaraoke(audio, wordSpans);

  return wrap;
}

// === SLEEP TIMER ===
function startSleepTimer(minutes) {
  cancelSleepTimer();
  sleepTimerSeconds = minutes * 60;
  document.getElementById("sleepTimer").style.display = "flex";
  document.getElementById("sleepTimer").classList.add("active");
  updateSleepTimerLabel();
  sleepTimerHandle = setInterval(() => {
    sleepTimerSeconds--;
    updateSleepTimerLabel();
    if (sleepTimerSeconds <= 0) {
      activeAudios.forEach(a => { if (!a.paused) a.pause(); });
      cancelSleepTimer();
    }
  }, 1000);
}
function updateSleepTimerLabel() {
  const m = Math.floor(sleepTimerSeconds / 60);
  const s = sleepTimerSeconds % 60;
  document.getElementById("sleepTimerLabel").textContent =
    "💤 Apaga en " + m + ":" + String(s).padStart(2, "0");
}
function cancelSleepTimer() {
  if (sleepTimerHandle) clearInterval(sleepTimerHandle);
  sleepTimerHandle = null;
  sleepTimerSeconds = 0;
  document.getElementById("sleepTimer").style.display = "none";
}
// Botón oculto para iniciar sleep timer — disponible via tecla S o gesto
window.startSleep = (min = 10) => startSleepTimer(min);

function crearTarjeta(c) {
  const card = document.createElement("div");
  card.className = "cuento-card";

  const imgWrap = document.createElement("div");
  imgWrap.className = "img-wrap";

  if (c.img_url) {
    const img = document.createElement("img");
    img.className = "cuento-img";
    img.src = c.img_url;
    img.alt = c.titulo || "";
    img.loading = "lazy";
    const ph = document.createElement("div");
    ph.className = "cuento-img-placeholder";
    ph.style.display = "none";
    ph.textContent = c.lang === "es" ? "🌙" : c.lang === "en" ? "⭐" : "✨";
    img.onerror = function() { this.style.display = "none"; ph.style.display = "flex"; };
    imgWrap.appendChild(img);
    imgWrap.appendChild(ph);
  } else {
    const ph = document.createElement("div");
    ph.className = "cuento-img-placeholder";
    ph.textContent = c.lang === "es" ? "🌙" : c.lang === "en" ? "⭐" : "✨";
    imgWrap.appendChild(ph);
  }

  const overlay = document.createElement("div");
  overlay.className = "lang-overlay overlay-" + c.lang;
  overlay.textContent = c.lang === "es" ? "🇪🇸 Español" : c.lang === "en" ? "🇬🇧 English" : "🇮🇹 Italiano";
  imgWrap.appendChild(overlay);
  card.appendChild(imgWrap);

  const body = document.createElement("div");
  body.className = "cuento-body";

  const titulo = document.createElement("h3");
  titulo.className = "cuento-titulo";
  titulo.textContent = c.titulo;
  body.appendChild(titulo);

  const texto = document.createElement("p");
  texto.className = "cuento-texto";
  const wordSpans = buildKaraokeText(texto, c);
  body.appendChild(texto);

  if (c.traduccion) {
    const tr = document.createElement("div");
    tr.className = "traduccion";
    tr.textContent = "📖 " + c.traduccion;
    body.appendChild(tr);
  }
  if (c.moraleja) {
    const m = document.createElement("div");
    m.className = "moraleja";
    m.textContent = "✨ " + c.moraleja;
    body.appendChild(m);
  }
  if (c.pregunta) {
    const q = document.createElement("div");
    q.className = "pregunta";
    q.textContent = "💭 " + c.pregunta;
    body.appendChild(q);
  }
  if (c.palabra) {
    const pal = document.createElement("div");
    pal.className = "palabra-nueva";
    pal.textContent = "📚 " + c.palabra;
    body.appendChild(pal);
  }
  if (c.audio) {
    const audioWrap = document.createElement("div");
    audioWrap.className = "audio-wrap";
    const label = document.createElement("div");
    label.className = "audio-label";
    const lbl = document.createElement("span");
    lbl.textContent = wordSpans ? "🎤 Karaoke" : "🔊 Escuchar";
    label.appendChild(lbl);
    const sleepBtn = document.createElement("button");
    sleepBtn.className = "audio-speed";
    sleepBtn.textContent = "💤 10min";
    sleepBtn.title = "Apagar en 10 minutos";
    sleepBtn.onclick = () => startSleepTimer(10);
    label.appendChild(sleepBtn);
    audioWrap.appendChild(label);

    const player = createAudioPlayer(c.audio, wordSpans);
    audioWrap.appendChild(player);
    body.appendChild(audioWrap);
  }

  card.appendChild(body);
  return card;
}

function filtrar() {
  const q = document.getElementById("searchInput").value.toLowerCase();
  let r = cuentos;
  if (filtros.lang !== "todos") r = r.filter(c => c.lang === filtros.lang);
  if (filtros.fecha !== "todas") r = r.filter(c => c.fecha === filtros.fecha);
  if (q) r = r.filter(c => c.titulo.toLowerCase().includes(q) || c.texto.toLowerCase().includes(q));

  // Reset lista de audios activos cuando re-renderizamos
  activeAudios = [];

  const byDate = {};
  r.forEach(c => { if (!byDate[c.fecha]) byDate[c.fecha] = []; byDate[c.fecha].push(c); });

  const lib = document.getElementById("biblioteca");
  const fechas = Object.keys(byDate).sort((a, b) => {
    const pa = a.split("/"), pb = b.split("/");
    return new Date(pb[2], pb[1] - 1, pb[0]) - new Date(pa[2], pa[1] - 1, pa[0]);
  });

  document.getElementById("contador").textContent =
    r.length + " cuento" + (r.length !== 1 ? "s" : "") + " en la biblioteca";

  if (fechas.length === 0) {
    lib.innerHTML = cuentos.length === 0
      ? '<div class="empty-state"><div class="moon-big">🌙</div><p>Los primeros cuentos llegarán esta noche...</p></div>'
      : '<div class="no-results">🌙 No se encontraron cuentos...</div>';
    return;
  }

  lib.innerHTML = "";
  fechas.forEach(fecha => {
    const group = document.createElement("div");
    group.className = "date-group";
    const label = document.createElement("div");
    label.className = "date-label";
    label.textContent = "🌙 " + fecha;
    group.appendChild(label);
    const grid = document.createElement("div");
    grid.className = "cuentos-grid";
    byDate[fecha].forEach(c => grid.appendChild(crearTarjeta(c)));
    group.appendChild(grid);
    lib.appendChild(group);
  });
}
